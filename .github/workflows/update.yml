name: Update NIH funding feed
on:
  schedule:
    - cron: "17 13 * * *" # 6:17 a.m. Pacific during daylight time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_feed.py
      - name: Save updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/
          git diff --cached --quiet || git commit -m "Update NIH funding feed"
          git push

