<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{SITE_TITLE}}</title><style>
:root{--ink:#17324d;--muted:#667788;--paper:#f7f6f2;--card:#fff;--teal:#147d78;--gold:#c88a2c;--line:#dce3e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(120deg,#113a57,#176d70);color:white;padding:38px max(24px,calc((100% - 1160px)/2)) 32px}h1{margin:0;font:700 clamp(28px,5vw,44px)/1.05 Georgia,serif}.subtitle{max-width:720px;opacity:.88;margin:10px 0 0}.wrap{max-width:1160px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-44px}.stat{background:#fff;border-radius:12px;padding:15px 18px;box-shadow:0 6px 24px #1232}.stat b{display:block;font-size:25px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin:22px 0}.toolbar input,.toolbar select,.toolbar button{border:1px solid var(--line);background:white;border-radius:8px;padding:11px;color:var(--ink)}.toolbar button{cursor:pointer}.errors{background:#fff2df;border-left:4px solid var(--gold);padding:12px 16px;margin:16px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:19px;margin:12px 0;box-shadow:0 2px 10px #16324d0b}.top{display:flex;justify-content:space-between;gap:16px}.kind,.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;background:#e4f2f1;color:#0b625e;margin:0 5px 5px 0}.new{background:#fff0c8;color:#79520e}.score{font-weight:700;color:var(--teal);white-space:nowrap}.card h2{font:700 20px/1.25 Georgia,serif;margin:9px 0 6px}.card h2 a{color:var(--ink);text-decoration:none}.card h2 a:hover{text-decoration:underline}.meta{color:var(--muted);font-size:13px}.desc{margin:12px 0;color:#354b5e}.empty{text-align:center;padding:70px 20px;color:var(--muted)}footer{color:var(--muted);text-align:center;padding:30px}.switch{display:flex;gap:6px;align-items:center;font-size:13px}@media(max-width:720px){.stats{grid-template-columns:1fr;margin-top:-20px}.toolbar{grid-template-columns:1fr}.top{display:block}}
</style></head><body><header><h1>{{SITE_TITLE}}</h1><p class="subtitle">A daily, relevance-ranked view of NIH funding opportunities, NIH Guide notices, and highlighted research topics.</p></header>
<main class="wrap"><section class="stats"><div class="stat"><b id="newCount">0</b>new today</div><div class="stat"><b id="highCount">0</b>high relevance</div><div class="stat"><b id="totalCount">0</b>matching items</div></section><div id="errors"></div>
<section class="toolbar"><input id="search" type="search" placeholder="Search titles, terms, institutes…"><select id="kind"><option value="">All sources</option></select><select id="topic"><option value="">All research areas</option></select><label class="switch"><input id="newOnly" type="checkbox"> New only</label></section><div id="feed"></div></main><footer id="updated"></footer>
<script id="feed-data" type="application/json">{{DATA}}</script><script>
const data=JSON.parse(document.getElementById('feed-data').textContent), $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kinds=[...new Set(data.items.map(x=>x.source))].sort(),topics=[...new Set(data.items.flatMap(x=>x.topics||[]))].sort();kinds.forEach(x=>$('#kind').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));topics.forEach(x=>$('#topic').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
function render(){let q=$('#search').value.toLowerCase(),k=$('#kind').value,t=$('#topic').value,n=$('#newOnly').checked;let items=data.items.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!k||x.source===k)&&(!t||(x.topics||[]).includes(t))&&(!n||x.is_new));$('#feed').innerHTML=items.length?items.map(x=>`<article class="card"><div class="top"><div><span class="kind">${esc(x.kind)}</span>${x.is_new?'<span class="kind new">NEW</span>':''}</div><span class="score">Relevance ${x.score}</span></div><h2><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h2><div class="meta">${esc(x.number)}${x.number?' · ':''}${esc(x.agency)}${x.posted?' · Posted '+esc(x.posted):''}${x.deadline?' · Deadline '+esc(x.deadline):''}</div><p class="desc">${esc((x.description||'').slice(0,600))}${(x.description||'').length>600?'…':''}</p><div>${(x.topics||[]).map(y=>`<span class="tag">${esc(y)}</span>`).join('')}</div></article>`).join(''):'<div class="empty">No items match these filters.</div>'}$('#totalCount').textContent=items.length}
$('#newCount').textContent=data.items.filter(x=>x.is_new).length;$('#highCount').textContent=data.items.filter(x=>x.score>=8).length;$('#updated').textContent='Last checked '+new Date(data.updated).toLocaleString();if(data.errors.length)$('#errors').innerHTML=`<div class="errors"><b>Some sources could not be checked:</b> ${data.errors.map(esc).join(' · ')}</div>`;document.querySelectorAll('.toolbar input,.toolbar select').forEach(x=>x.addEventListener('input',render));render();
</script></body></html>
