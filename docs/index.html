<script id="feed-data" type="application/json">{"items": [{"id": "grant:361104", "kind": "Funding opportunity", "number": "PAR-27-069", "title": "Accelerating Discovery through Partnered Research with All of Us to Analyze Participant Biospecimens (X01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-19", "deadline": "2027-03-01", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361104", "description": "The purpose of this Program Announcement with Special Receipt, Referral, and/or Review Considerations (PAR) is to solicit applications to access stored blood plasma, blood serum, and extracted DNA from the All of Us Research Program supported Biobank to advance the program's mission of accelerating health research and medical breakthroughs, enabling individualized prevention, treatment, and care for all of us.All of Us partnered research studies are collaborative initiatives funded by a study sponsor external to All of Us to collect and add new data to the All of Us Researcher Workbench in accordance with All of Us\" best practices. All of Us partnered research studies are open to the broad scientific community and require investigators to apply for and receive an X01 award under this announcement.This will enable longitudinal follow‐up and repeat sampling, and provide multiomic data (genomics, proteomics, metabolomics, and other high‐dimensional molecular profiles), integrated clinical, environmental, and life‐course data, infrastructure designed to support future clinical‐trial recruitment, and public‐private partnership pathways.This opportunity will enable researchers to conduct assays to evaluate associations between newly collected and existing All of Us data and add new data to the All of Us dataset for broad use by the research community. High-priority areas for biospecimen analyses may include, but are not limited to, large scale projects that propose integrated multiomics analyses, early disease detection, biomarker discovery or validation, novel risk models for incident disease, and/or novel disease stratification for chronic disease risk, diagnosis, and prognosis, in support of advancing precision medicine. For more information, please visit the All of Us X01 Partnered Research Studies Resource webpage.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 8, "topics": ["omics and genetics"], "matches": ["genomics", "metabolomics", "proteomics"], "excluded": []}, {"id": "grant:363210", "kind": "Funding opportunity", "number": "RFA-HD-28-003", "title": "Elucidation and Validation of the role of Transporters in the Placenta, Lactating Mammary Gland, Developing Gut, and Blood Brain Barrier", "agency": "HHS-NIH11", "posted": "2026-07-16", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363210", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 7, "topics": ["human milk and lactation"], "matches": ["lactating", "mammary gland"], "excluded": []}, {"id": "grant:361164", "kind": "Funding opportunity", "number": "PAR-27-071", "title": "Discovery of the Genetic Basis of Childhood Cancers and of Congenital Anomalies: Gabriella Miller Kids First Pediatric Research Program (X01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-18", "deadline": "2027-01-11", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361164", "description": "As part of the Gabriella Miller Kids First Pediatric Research Program (Kids First Program), the NIH invites applications to submit samples from pediatric cohorts for whole genome sequencing at a Kids First Program supported genomic data generating centers. Applicants are encouraged to propose sequencing of existing pediatric cancer or congenital anomaly cohorts to elucidate the genetic contribution (somatic and/or germline) to childhood cancers, to investigate the genetic etiology of congenital anomalies, to study the molecular basis of the associations between congenital anomalies and increased cancer risk, or to expand the range of pediatric disorders included within the Kids First Data Resource. The program will accept applications that propose whole genome, exome, and transcriptome sequencing, as well as clinical-grade sequencing, long-read sequencing, proteomics, and epigenomic assays of tumor or affected tissue, when justified. Applicants are encouraged to propose cohorts to increase representation of existing Kids First Program projects. These data, and associated clinical and phenotypic data, will become part of the Kids First Data Resource Center for sharing with the research community.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 7, "topics": ["omics and genetics"], "matches": ["proteomics", "sequencing"], "excluded": []}, {"id": "grant:359740", "kind": "Funding opportunity", "number": "RFA-AG-27-010", "title": "Data Coordinating Center for the Aging and Alzheimer’s Disease Mouse Brain Atlas (AD-MBA) (U24 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-01", "deadline": "2026-11-10", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359740", "description": "This Notice of Funding Opportunity (NOFO) invites applications proposing a Data Coordinating Center that integrates and disseminates multiscale mouse brain datasets for the aging and Alzheimer's disease (AD) research community. The Data Coordinating Center will establish the Aging and AD Mouse Brain Atlas (AD-MBA), which will serve as a central, unified research resource for multi-omic and connectomic mouse brain datasets emerging from the NIA AD Multimodal Atlas Projects (AD-MAPs). The Data Coordinating Center will (1) leverage the NIA-supported AD Knowledge Portal data infrastructure to facilitate hosting, deposition, and dissemination of multimodal datasets generated by the AD-MAPs program, (2) facilitate collaborative analyses among the data-contributing teams, (3) develop/optimize and incorporate tools for multiscale integration of multi-omics and connectomics datasets, and (4) create a broadly accessible web-based interface for the visualization and dissemination of integrated multiscale data.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["omics and genetics"], "matches": ["multi-omics"], "excluded": []}, {"id": "grant:360544", "kind": "Funding opportunity", "number": "RFA-DK-27-120", "title": "Nutrition Obesity Research Centers (NORCs) (P30 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-20", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360544", "description": "This Notice of Funding Opportunity (NOFO) invites applications from institutions/organizations that propose to establish core centers that are part of an integrated and existing program of nutrition and/or obesity research. The Nutrition Obesity Research Centers (NORC) program is designed to support and enhance the national research effort in nutrition and obesity. NORCs support three primary research-related activities: Research Core services, a Pilot and Feasibility (P and F) program, and a Scientific Catalyst program. All activities pursued by Nutrition Obesity Research Centers are designed to enhance the efficiency, productivity, effectiveness, and multidisciplinary nature of research in nutrition and obesity.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["microbiome and nutrition"], "matches": ["nutrition"], "excluded": []}, {"id": "grant:359280", "kind": "Funding opportunity", "number": "RFA-HG-27-012", "title": "GREGoRi Technology Integration Center (U01, Clinical Trials Optional)", "agency": "National Institutes of Health", "posted": "2026-06-18", "deadline": "2026-10-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359280", "description": "The Genomics Research to Elucidate the Genetics of Rare Diseases:innovation (GREGoRi) initiative seeks to accelerate a paradigm shift in rare disease diagnosis by reimagining the tools, molecular technologies and analytical approaches used to identify the causal gene(s) and/or variant(s) underlying rare genetic disorders. The purpose of this Notice of Funding Opportunity is to establish the GREGoRi Technology Integration Center, which will enable the development of standards and best practices for applying new and emerging molecular methods in rare disease diagnosis. A major deliverable of the Center will be a multidimensional dataset that can be used for the development and benchmarking of novel tools and strategies that facilitate rare disease diagnosis.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["omics and genetics"], "matches": ["genomics"], "excluded": []}, {"id": "grant:360387", "kind": "Funding opportunity", "number": "RFA-DK-27-121", "title": "Optimal Treatment Strategies for use of Anti-Obesity Medications (AOMs) in Children and Adolescents Clinical Centers (U01 Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-06-08", "deadline": "2026-10-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360387", "description": "This Notice of Funding Opportunity (NOFO) invites applications from clinical centers to participate in a consortium to test anti-obesity medication (AOM) treatment strategies for youth with obesity that maximize benefits and minimize risks of AOM use. Such intervention strategies should support the promotion of healthy growth and development; adequate nutritional status/intake, healthy eating and physical activity behaviors; mental health and well-being (e.g., body image, self-esteem, mood, etc.), and quality of life and be feasible to implement in clinical care settings. Priority areas include testing strategies to determine optimal developmental stage for AOM initiation, rate and amount of weight loss, AOM class, dose, frequency, and duration, and content and intensity of adjunct lifestyle therapies that may be imperative to ensure normal psychological and physical development and to potentially avoid lifelong dependence on AOMs. Investigators should also evaluate potential predictors of response/ nonresponse to various treatment strategies under evaluation. The clinical centers may conduct independent or multicenter trials but will collaborate on the development of protocols, use of common measures and data elements, use of a central laboratory and standardized procedures to collect data and biospecimens, and data analyses and manuscripts. This NOFO uses a cooperative agreement mechanism (U01) and runs in parallel with a companion NOFO (RFA-DK-27-136).", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["microbiome and nutrition"], "matches": ["nutritional"], "excluded": []}, {"id": "grant:360441", "kind": "Funding opportunity", "number": "RFA-DK-27-136", "title": "Optimal Treatment Strategies for use of Anti-Obesity Medications (AOMs) in Children and Adolescents Research Coordinating Center (U24 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-08", "deadline": "2026-10-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360441", "description": "This Notice of Funding Opportunity (NOFO) invites applications for a Research Coordinating Center (RCC) to participate in a consortium of clinical centers that will test anti-obesity medication (AOM) treatment strategies for youth with obesity that maximize benefits and minimize risks of AOM use. Such intervention strategies should support the promotion of healthy growth and development; adequate nutritional status/intake, healthy eating and physical activity behaviors; mental health and well-being (e.g., body image, self-esteem, mood, etc.), and quality of life and be feasible to implement in clinical care settings. Priority areas include testing strategies to determine optimal developmental stage for AOM initiation, rate and amount of weight loss, AOM class, dose, frequency, and duration, and content and intensity of adjunct lifestyle therapies that may be imperative to ensure normal psychological and physical development and to potentially avoid lifelong dependence on AOMs. Investigators should also evaluate potential predictors of response/ nonresponse to various treatment strategies under evaluation. The clinical centers may conduct independent or multicenter trials but will collaborate on the development of protocols, use of common measures and data elements, use of a central laboratory and standardized procedures to collect data and biospecimens, and data analyses and manuscriptsThe RCC will lead, manage, and harmonize efforts for the Consortium including 1) providing management and administrative support; 2) providing leadership and expertise on statistical design and analysis, 3) providing research coordination with a central laboratory, 4) harmonizing data collection methods and use of common data elements, 5) developing the database; 6) conducting data management and data analyses for Consortium studies; and 7) fostering research collaborations. This NOFO uses a cooperative agreement mechanism (U24) and runs in parallel with a companion NOFO (RFA-DK-27-121).", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["microbiome and nutrition"], "matches": ["nutritional"], "excluded": []}, {"id": "grant:362639", "kind": "Funding opportunity", "number": "RFA-HG-28-003", "title": "ancient DNA for Modern Genomics (aDMG) Research Projects (U01 Clinical Trials Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-06-02", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/362639", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["omics and genetics"], "matches": ["genomics"], "excluded": []}, {"id": "grant:360554", "kind": "Funding opportunity", "number": "PAR-27-051", "title": "NIH Brain Development Cohorts (NBDC) and Population Assessment of Tobacco and Health (PATH) Study Biospecimen Access (X01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-01", "deadline": "2029-04-17", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360554", "description": "The National Institutes of Health seek to advance their mission by providing the scientific community with the opportunity to request access to biospecimens from the Adolescent Brain Cognitive DevelopmentSM (ABCD) Study, the HEALthy Brain and Child Development (HBCD) Study, and the Population Assessment of Tobacco and Health (PATH) Study to conduct research consistent with the respective study objectives that will maximize the scientific utility of these limited samples. Applications should expand the knowledge gained from these studies and advance our understanding of the multiple genetic and environmental factors, such as exposure to substances, that affect health and disease over the course of a lifetime.", "source": "Grants.gov", "first_seen": "2026-09-02", "is_new": false, "score": 4, "topics": ["development and disparities"], "matches": ["child development"], "excluded": []}, {"id": "grant:360404", "kind": "Funding opportunity", "number": "PAR-27-065", "title": "NINDS Efficacy and Exploratory Clinical Trials (UG3/UH3 - Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2029-03-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360404", "description": "This Notice of Funding Opportunity (NOFO) encourages applications for investigator-initiated clinical trials to the National Institute of Neurological Disorders and Stroke (NINDS). These trials must address questions within the mission and research interests of the NINDS and may include studies of small molecules, biologics, devices as well as surgical, behavioral, diet-based, or rehabilitation therapies. Studies addressing neurological diseases and care across the lifespan are highly encouraged. This notice invites both early- and middle-phase exploratory clinical trials as well as later phase confirmatory Phase 3 or comparative effectiveness clinical trials.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["microbiome and nutrition"], "matches": ["diet"], "excluded": []}, {"id": "grant:363679", "kind": "Funding opportunity", "number": "PAR-28-059", "title": "Translational Research in Maternal and Pediatric Pharmacology and Therapeutics", "agency": "HHS-NIH11", "posted": "2026-08-20", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363679", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["maternal and infant health"], "matches": ["maternal"], "excluded": []}, {"id": "grant:359644", "kind": "Funding opportunity", "number": "RFA-HG-27-013", "title": "GREGoRi Innovation Projects (U01 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-18", "deadline": "2026-10-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359644", "description": "The Genomics Research to Elucidate the Genetics of Rare Diseases:innovation (GREGoRi) initiative seeks to accelerate a paradigm shift in rare disease diagnosis by reimagining the tools, molecular technologies and analytical approaches used to identify the causal gene(s) and/or variant(s) underlying rare genetic disorders. This Notice of Funding Opportunity is intended to stimulate the development and testing of highly innovative experimental or computational approaches for rare disease diagnosis, that have the potential to make transformative improvements to the current state of the art.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["omics and genetics"], "matches": ["genomics"], "excluded": []}, {"id": "grant:359279", "kind": "Funding opportunity", "number": "RFA-HG-27-011", "title": "GREGoRi Data Coordination and Outreach Center (U01, Clinical Trials Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-18", "deadline": "2026-10-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359279", "description": "The Genomics Research to Elucidate the Genetics of Rare Diseases:innovation (GREGoRi) initiative seeks to accelerate a paradigm shift in rare disease diagnosis by reimagining the tools, molecular technologies and analytical approaches used to identify the causal gene(s) and/or variant(s) underlying rare genetic disorders. The purpose of this Notice of Funding Opportunity is to establish the GREGoRi Data Coordination and Outreach Center. The Data Coordination and Outreach Center will act as the central point of coordination for the GREGoRi Research Program, and will be responsible for ensuring that the protocols, data, metadata, computational tools and other resources developed as part of GREGoRi are made available to the broader research community.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["omics and genetics"], "matches": ["genomics"], "excluded": []}, {"id": "grant:362723", "kind": "Funding opportunity", "number": "PAR-27-119", "title": "Center for Inherited Disease Research (CIDR) High Throughput Sequencing and Genotyping Resource Access (X01 Clinical Trial Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-06-09", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/362723", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["omics and genetics"], "matches": ["sequencing"], "excluded": []}, {"id": "grant:362666", "kind": "Funding opportunity", "number": "PAR-28-028", "title": "Research on the Ethical, Legal and Social Implications (ELSI) of Genomics", "agency": "HHS-NIH11", "posted": "2026-06-03", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/362666", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["omics and genetics"], "matches": ["genomics"], "excluded": []}, {"id": "grant:359945", "kind": "Funding opportunity", "number": "RFA-HD-27-007", "title": "Using Archived Data and Specimen Collections to Advance Maternal and Pediatric HIV/AIDS Research (R21 CT Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-19", "deadline": "2028-10-20", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359945", "description": "The purpose of this Funding Opportunity is to address the needs of the maternal and pediatric HIV scientific community for research data translation and sharing.This initiative will support secondary data analyses using archived HIV/AIDS data and specimens. The goal of this initiative is to encourage the scientific community to utilize HIV/AIDS archived data sets and specimen collections to answer important questions about the epidemiology, pathogenesis, treatment, clinical manifestations, and HIV-associated co-infections and co-morbidities in maternal, pediatric and adolescent populations.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["maternal and infant health"], "matches": ["maternal"], "excluded": []}, {"id": "grant:361833", "kind": "Funding opportunity", "number": "RFA-AI-27-014", "title": "Development of Candidate Medical Countermeasures (MCMs) and Technologies Against Radiological/Nuclear or Chemical Threats (U01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-01", "deadline": "2028-10-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361833", "description": "The purpose of this notice of funding opportunity (NOFO) is to support research that advances understanding of the natural history of radiation or chemical exposures; develops relevant injury models; identifies and validates diagnostic tools, biomarkers, or triage technologies; and supports the development of effective medical countermeasures (MCMs) to mitigate or treat acute and/or delayed injuries resulting from radiological/nuclear or chemical public health emergencies.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:361213", "kind": "Funding opportunity", "number": "RFA-DK-27-112", "title": "Single Source for the Continuation of the Epidemiology of Diabetes Interventions and Complications (EDIC) Study Research Center (Collaborative U01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2026-11-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361213", "description": "This is a Notice of Funding Opportunity (NOFO) for a Single Source that will invite an application from the eligible organization to apply. Please see Section III. Eligibility for additional information. In accordance with NIH standard peer-review processes, applications will be peer-reviewed, and only meritorious applications will be considered for funding. Through this NOFO, the National institute of Diabetes and Digestive and Kidney Diseases (NIDDK) invites an application to continue to follow the Epidemiology of Diabetes Interventions and Complications (EDIC) cohort through a collaborative cooperative agreement that addresses specific knowledge gaps in the development and progression of type 1 diabetes complications. Applications should include hypothesis-based research, support for cohort infrastructure and/or maintenance, continued follow-up, and supporting collaborative research to utilize the EDIC cohort as well as its data set and biologic/genetic samples.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360674", "kind": "Funding opportunity", "number": "RFA-DK-27-127", "title": "Cooperative Centers for Experimental Hematology (CCEHs) (U54- Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2026-09-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360674", "description": "The purpose of this Notice of Funding Opportunity (NOFO) is to invite applications for Centers within the NIDDK Cooperative Centers of Experimental in Hematology (CCEH) Program. Each Center will support one to three Biomedical Research Cores and an Administrative Core, including an Enrichment Program. Each Center is expected to work collaboratively with NIDDK, the Hematology Coordinating Center (HCC), and the other CCEH Centers. The CCEH Program is designed to increase access to critical research resources and expertise unique to nonmalignant hematology research. By providing innovative technology, resources, and expertise to the greater hematology research community, the program will serve as a national hub, aimed at recruiting and retaining both junior scientists just beginning their careers in the field as well as established investigators from other domains.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360606", "kind": "Funding opportunity", "number": "RFA-CA-27-005", "title": "Glioblastoma Therapeutics Network (GTN) (U19 Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2026-10-01", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360606", "description": "Through this Notice of Funding Opportunity (NOFO), the National Cancer Institute (NCI) solicits applications for research on novel therapies for adult glioblastoma (GBM). The goal is to improve the treatment of adult GBM by developing novel effective agents that can cross the blood brain barrier (BBB) and testing them clinically. Successful early-stage trials of new drugs from this NOFO would transition seamlessly to later stage trials using well-established NCI clinical trial mechanisms.To implement this concept, a highly collaborative GBM Therapeutics Network (GTN) of cross-cutting teams will be established, each team capable of driving therapeutic agent(s) from pre-clinical development, through investigational new drugs (IND) studies, into pilot clinical studies in humans. Appropriate therapeutic agents include: (1) novel agents or (2) agents or combinations approved for other indications and repurposed for treatment of GBM following appropriate preclinical studies. The scope of the NOFO, from late pre-clinical through early (Phase 0/1) clinical studies, uniquely spans a gap in the GBM drug development process.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360398", "kind": "Funding opportunity", "number": "RFA-NS-27-002", "title": "BRAIN Initiative: Integrative Team-Research BRAIN Circuits Program - iBCP (RM1 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2028-06-23", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360398", "description": "This Notice of Funding Opportunity (NOFO) supports transdisciplinary research teams seeking to develop mechanistic, biologically grounded explanations of how neural circuits and their cellular building blocks give rise to central nervous system (CNS) function. Teams must integrate expertise spanning molecular and cellular through systems neuroscience, with strong collaboration between experimental and computational investigators, to bridge cells, circuits, and behavior in a unified framework that yields mechanistic insight.Applications must explicitly connect three core elements: (1) characterization of circuit components (e.g., cell types and/or connectivity); (2) measurement of dynamic circuit activity, incorporating in vivo CNS recordings at cellular and sub-second temporal resolution; and (3) analyses of a tractable behavior or functional output.To address this significant challenge in neuroscience, proposed studies are expected to leverage innovative conceptual or theoretical frameworks, predictive models, and/or cutting-edge approaches that unify these three levels of analysis and bridge experimental and computational components.Recipients are expected to participate in BRAIN consortia activities to identify standards of practice towards multi-level integration.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360947", "kind": "Funding opportunity", "number": "PAR-27-068", "title": "Limited Competition: NIGMS Mature Synchrotron Resources (MSR) for Structural Biology (P30 - Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2028-10-02", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360947", "description": "This Notice of Funding Opportunity (NOFO) supports \"mature\" resources at synchrotron facilities that provide user access to X-ray beamlines for static and dynamic imaging of biological systems ranging from molecules to organs. \"Mature\" refers to the techniques made available at the resource beamlines, which must be well established and provide utility to the communities they serve without requiring significant novel technology development. Applications may only request support for existing synchrotron resources that are currently supported by NIGMS funding. The facility is expected to be maintained or upgraded to current best practices, make its capabilities and availability known to the biomedical research community through outreach activities, and provide user training and support.This is a Notice of Funding Opportunity (NOFO) for a Limited Competition that will invite application(s) from eligible organization(s) to apply. Please see Section III. Eligibility for additional information. In accordance with NIH standard peer-review processes, the application(s) will be peer-reviewed, and only meritorious application(s) will be considered for funding.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:361518", "kind": "Funding opportunity", "number": "PAR-27-053", "title": "Exploratory Clinical Neuroscience Research on Substance Use Disorders (R61/R33 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2028-06-16", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361518", "description": "This notice of funding opportunity (NOFO) uses a R61/R33 Phased Innovation Award activity code to support clinical research applications that are exploratory and developmental in nature and focus on understanding the neurobiological mechanisms underlying substance use disorders (SUD), including fundamental circuitry and behavior relevant to substance use. For projects not requiring a phased research approach, applicants are encouraged to apply under a different funding activity code (e.g., PA-25-305 \"Research Project Grant (Parent R01 Clinical Trial Required)\" or its subsequent reissue).", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363695", "kind": "Funding opportunity", "number": "PAR-28-060", "title": "Small Instruments and Modern Equipment for Shared-use Biomedical Research Facilities and Resources (S15 Clinical Trial Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-08-24", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363695", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363678", "kind": "Funding opportunity", "number": "RFA-DK-28-116", "title": "Multimodal AI to Accelerate Precision Medicine for Type 1 Diabetes (U01- Clinical Trials Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-08-20", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363678", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363126", "kind": "Funding opportunity", "number": "RFA-OD-28-001", "title": "Tobacco Centers of Regulatory Science (TCORS) (Clinical Trial Optional)", "agency": "HHS-NIH11", "posted": "2026-07-09", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363126", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363052", "kind": "Funding opportunity", "number": "RFA-DK-28-112", "title": "NIDDK Disease Research and Translational Core Centers (P30 Clinical Trial Optional)", "agency": "HHS-NIH11", "posted": "2026-07-02", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363052", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches"
