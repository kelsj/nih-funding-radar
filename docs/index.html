rojects are expected to have high potential for demonstrable, positive impact on patient outcomes and/or healthcare processes.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359666", "kind": "Funding opportunity", "number": "RFA-RM-27-013", "title": "Model-to-Clinic (M2C) for Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) (UG3/UH3, Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-19", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359666", "description": "The overarching goal of this notice of funding opportunity (NOFO) and its companion opportunities is to establish the Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) Program to support development of innovative, reliable, cost-effective, and sustainable multimodal AI-based clinical decision support (CDS) tools. PRIMED-AI CDS tools are based on the integration of clinical imaging with other types of multimodal health data to enhance care for patients with a wide range of health conditions. The PRIMED-AI Program seeks to catalyze the adoption of AI-based CDS tools into clinical workflows to enable novel personalized medicine strategies that address significant health challenges.The purpose of this NOFO is to catalyze the translation of Artificial Intelligence (AI)-enabled, image-centered, multimodal CDS tools, developed as Software as a Medical Device, from training and testing of prototypes towards clinical applications that address unmet health challenges in precision medicine. These projects are expected to have high potential for demonstrable, positive impact on patient outcomes and/or healthcare processes.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359269", "kind": "Funding opportunity", "number": "RFA-RM-27-014", "title": "Validation Center for Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) (U54 Clinical Trials Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-02", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359269", "description": "The overarching goal of this notice of funding opportunity (NOFO) and its companion opportunities is to establish the Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) Program to support development of innovative, reliable, cost-effective, and sustainable multimodal AI-based clinical decision support (CDS) tools. PRIMED-AI CDS tools are based on the integration of clinical imaging with other types of multimodal health data to enhance care for patients with a wide range of health conditions. The PRIMED-AI Program seeks to catalyze the adoption of AI-based CDS tools into clinical workflows to enable novel personalized medicine strategies that address significant health challenges. The purpose of this NOFO is to solicit applications for the creation of a Validation Center to serve as a dedicated hub for the comprehensive evaluation and characterization of AI-enabled, image-based, multimodal CDS tools developed by the PRIMED-AI Consortium, to ensure these tools are reliable, reproducible, and generalizable. The Validation Center will focus on verification, validation, interoperability, and uncertainty quantification to comprehensively characterize performance of the CDS tools developed by the program. The core functions of the Validation Center will involve the systematic validation of PRIMED-AI Consortium deliverables, including those emerging from award recipients under the Playbook, Data-to-Model Academic-Industrial Partnerships, and Model-to-Clinic NOFOs.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359268", "kind": "Funding opportunity", "number": "RFA-RM-27-015", "title": "Logistics Center for Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) (U24 Clinical Trials Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-02", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359268", "description": "The overarching goal of this notice of funding opportunity (NOFO) and its companion opportunities is to establish the Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) Program to support development of innovative, reliable, cost-effective, and sustainable multimodal AI-based clinical decision support (CDS) tools. PRIMED-AI CDS tools are based on the integration of clinical imaging with other types of multimodal health data to enhance care for patients with a wide range of health conditions. The PRIMED-AI Program seeks to catalyze the adoption of AI-based CDS tools into clinical workflows to enable novel personalized medicine strategies that address significant health challenges.The purpose of this NOFO is to create a Logistics Center for the PRIMED-AI Program to facilitate and coordinate PRIMED-AI activities to maximize impact for the PRIMED-AI community. Within the Logistics Center, three integrated Cores will serve the functions of Administration, Evaluation, and Outreach for the PRIMED-AI Consortium. It is expected that the Logistics Center will work closely with other PRIMED-AI consortium members to collect, curate and disseminate information regarding tools developed by the PRIMED-AI award recipients, and will facilitate widespread access and awareness across the relevant scientific, patient, and clinical communities.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359271", "kind": "Funding opportunity", "number": "RFA-RM-27-011", "title": "Development and Testing of a Multi-use Frameworks Playbook for Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) (U01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359271", "description": "The overarching goal of this notice of funding opportunity (NOFO) and its companion opportunities is to establish the Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) Program to support development of innovative, reliable, cost-effective, and sustainable multimodal AI-based clinical decision support (CDS) tools. PRIMED-AI CDS tools are based on the integration of clinical imaging with other types of multimodal health data to enhance care for patients with a wide range of health conditions. The PRIMED-AI Program seeks to catalyze the adoption of AI-based CDS tools into clinical workflows to enable novel personalized medicine strategies that address significant health challenges. The purpose of this NOFO is to solicit applications for the design, development, and preliminary validation of robust frameworks for the application of multimodal-artificial intelligence (AI) models for clinical use. Frameworks developed through these awards would populate a \"playbook\", defined as a collection of actionable guidelines, standardized protocols, and/or standard operating procedures (SOPs) for reliable and effective development and deployment of multimodal AI tools. It is expected that the frameworks delineated in this playbook will directly address PRIMED-AI objectives and needs, while also remaining flexible enough to enable sufficient extensibility and interoperability for use across a broad spectrum of multimodal biomedical AI applications, both internal and external to the PRIMED-AI Program.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360986", "kind": "Funding opportunity", "number": "RFA-RM-27-001", "title": "NIH Director’s Pioneer Award (DP1 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-29", "deadline": "2026-09-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360986", "description": "The NIH Director\"s Pioneer Award supports individual scientists of exceptional creativity who propose bold and highly innovative research projects with the potential to produce a major impact on broad, important areas relevant to the mission of NIH. To be considered pioneering, the proposed research must reflect substantially different scientific directions from those already being pursued in the investigator\"s research program or elsewhere. Applications in all topics relevant to the broad mission of NIH are welcome. Research may involve basic, translational, or clinical research. The NIH Director\"s Pioneer Award is a component of the High-Risk, High-Reward Research (HRHR) program of the NIH Common Fund.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359651", "kind": "Funding opportunity", "number": "RFA-AG-27-007", "title": "Renewal of the Clinician-Scientists Transdisciplinary Aging Research (Clin-STAR) Coordinating Center (U24 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-26", "deadline": "2026-09-29", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359651", "description": "The purpose of this Notice of Funding Opportunity (NOFO) is to support the next 5-year award period of the Clinician-Scientist Transdisciplinary Aging Research Coordinating Center (Clin-STAR CC), whose mission is to serve as a national resource for clinician-investigators across specialties and disciplines who are focusing their careers on aging research. This NOFO intends to build upon NIA's substantial investments to foster the development of clinician-scientists across specialties and disciplines. The specific goals of this initiative are to convey scientific and research knowledge on aging research; foster networking and collaboration between clinician-scientist leaders in aging research and clinician-investigators across specialties and disciplines who wish to focus on aging research; provide mentoring and career development support for emerging clinician-scientists committed to pursuing aging research in their clinical specialty or discipline; and advance interdisciplinary research projects in aging. Ultimately, the Clin-STAR CC is intended to provide a multi-faceted national research platform leading to improved patient-centered care for older adults across specialties and disciplines.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360882", "kind": "Funding opportunity", "number": "PAR-27-021", "title": "Seed Instrumentation Support (SIS) Program (S10 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-25", "deadline": "2028-07-01", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360882", "description": "This Notice of Funding Opportunity (NOFO) aims to build new research capacity and develop a sustainable research program by supporting the purchase of a single commercially available biomedical research instrument currently unavailable in the institution. Instruments funded through this program must be shared among the users to create new research opportunities, enable reproducible data generation, encourage collaborative research and training, and strengthen long-term research capabilities. The minimum award is $50,000. While there is no limit on the total cost of the instrument, the maximum award is $400,000.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360532", "kind": "Funding opportunity", "number": "PAR-27-022", "title": "Shared Instrumentation Grant (SIG) Program (S10 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-25", "deadline": "2028-07-01", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360532", "description": "This Notice of Funding Opportunity (NOFO) announces the restructured Shared Instrumentation Grant (SIG) Program that consolidates three existing shared-use instrumentation programs, i.e., the Shared Instrumentation Grant program, the High-End Instrumentation Grant program, and the Basic Instrumentation Grant program. The NOFO invites applications from groups of NIH-supported investigators to purchase or upgrade a single state-of-the-art commercially available instrument or an integrated instrumentation system. The instruments purchased through the SIG Program are required to be optimally shared among the users to ensure efficient and cost-effective research operations, enable rigorous and reproducible measurements, and encourage collaborative research and benefit broad research communities at large. The minimum award is $300,000. There is no cap on the total cost of the instrument; however, the maximum award is $5,000,000. Cost sharing is required for premium instruments or special use instruments.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:362965", "kind": "Funding opportunity", "number": "RFA-OD-27-009", "title": "Limited Competition: NIH Research Evaluation and Commercialization Hubs (REACH) (SB0 Clinical Trial Optional)", "agency": "HHS-NIH11", "posted": "2026-06-25", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/362965", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:362950", "kind": "Funding opportunity", "number": "RFA-AI-28-007", "title": "Childhood Asthma in Urban Settings Clinical Research Network", "agency": "HHS-NIH11", "posted": "2026-06-24", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/362950", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360561", "kind": "Funding opportunity", "number": "RFA-DA-27-007", "title": "Limited Competition: Growing Great Ideas: Research Education Course in Entrepreneurship and Product Development for Researchers Studying Drug Use, Drug Misuse, and Drug Addiction (UE5 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-23", "deadline": "2026-10-01", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360561", "description": "This notice of funding opportunity (NOFO) seeks to establish a course to equip researchers studying drug use, drug misuse, and drug addiction with the skills, knowledge, and practical tools needed to translate their scientific discoveries into impactful real world solutions. The course is envisioned to focus on building capacity in product development, entrepreneurship, and innovation pathways so participants can more effectively move biomedical ideas from early research toward implementation, or commercialization. By combining structured training, mentorship, and hands-on experience, the course is envisioned to accelerate the development of biomedical products that address the complex challenges of drug use, drug misuse, and drug addiction, while fostering an interdisciplinary community of investigators prepared to navigate the scientific, regulatory, and business aspects of this unique research field.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360436", "kind": "Funding opportunity", "number": "RFA-DK-27-119", "title": "Silvio O. Conte Digestive Diseases Research Core Centers (P30-Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-16", "deadline": "2027-02-10", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360436", "description": "This Notice of Funding Opportunity (NOFO) invites applications for Silvio O. Conte Digestive Diseases Research Core Centers (DDRCCs). The DDRCCs are part of an integrated program of digestive and liver diseases research support provided by the NIDDK. The purpose of this Centers program is to bring together basic and clinical investigators to enhance communication, collaboration, and effectiveness of ongoing research related to digestive and/or liver diseases within the NIDDK's mission. DDRCCs are based on the core concept, whereby shared resources aimed at fostering productivity, synergy, and new research ideas among the funded investigators are supported in a cost-effective manner. Each proposed DDRCC must be organized around a central theme that reflects the focus of the digestive or liver diseases research of the Center members. The central theme must be within the primary mission of the NIDDK, and not thematic areas for which other NIH Institutes or Centers are considered the primary source of NIH funding.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359859", "kind": "Funding opportunity", "number": "PAR-27-064", "title": "NIAID Clinical Trial Implementation Cooperative Agreement (U01 Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-06-16", "deadline": "2029-07-05", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359859", "description": "This notice of funding opportunity (NOFO) encourages applications for implementation of investigator-initiated, milestone driven clinical trials that need enhanced oversight, and as applicable, include mechanistic studies. Mechanistic work in clinical trials may be of great value because it promotes the understanding of human diseases and the development of future therapeutic modalities. Support is available for clinical trials up to 5 years, as well as for extended clinical trials of 6- or 7-years.Investigators are encouraged to visit this NIH website for additional information about the overall mission and research areas of NIAID.Only one clinical trial may be proposed in each NIAID Clinical Trial Implementation Cooperative Agreement (U01) application. In accordance with NIH standard peer-review processes, the applications will be peer-reviewed, and only meritorious applications will be considered.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359161", "kind": "Funding opportunity", "number": "RFA-NS-27-007", "title": "HEAL Initiative: Non-addictive Analgesic Therapeutics Development [Small Molecules and Biologics] to Treat Pain (UG3/UH3 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-16", "deadline": "2029-02-20", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359161", "description": "The purpose of this Notice of Funding Opportunity (NOFO) is to support the preclinical optimization and development of safe, effective, and non-addictive small molecule and biologic therapeutics for the treatment of pain. The goal of the program is to accelerate the advancement of promising early-stage therapeutic candidates and facilitate their readiness for Phase II clinical trials. Applicants must have a promising small molecule or biologic lead candidate for optimization, a strong biological rationale for the proposed approach, and established assays to guide the optimization process. The scope of the program includes lead optimization, early-stage development activities, IND-enabling studies, development of pharmacodynamic and/or target engagement biomarkers, preparation and submission of an Investigational New Drug (IND) application, and Phase I clinical testing. This is a milestone-driven, phased cooperative agreement program that involves active participation by NIH program staff in project planning and ongoing monitoring of research progress.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360446", "kind": "Funding opportunity", "number": "PAR-27-024", "title": "Biomedical Technology Optimization and Dissemination Center (BTOD) (RM1 - Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-08", "deadline": "2029-01-29", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360446", "description": "This Notice of Funding Opportunity (NOFO) encourages applications for NIGMS Biomedical Technology Optimization and Dissemination (BTOD) Centers to support late-stage technology optimization and sustainable dissemination of the technologies to the wider biomedical research community. A BTOD Center should be at the leading edge of its field with respect to both technology optimization and engagement with relevant research communities.BTOD projects must address biomedical research areas within the NIGMS mission. Potential applicants are strongly encouraged to consult with NIGMS staff about adherence of their proposed research strategy to the Institute's goals and mission and its responsiveness to this NOFO.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:362672", "kind": "Funding opportunity", "number": "RFA-DA-27-016", "title": "HEAL Initiative: Translating Addiction Epidemiology, Prevention, Treatment, and Recovery Research into Practice (R61/R33 - Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-04", "deadline": "2029-02-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/362672", "description": "The goal of this notice of funding opportunity (NOFO) is to address the opioid crisis and/or overdose events by supporting action-oriented research, accelerating the translation of addiction epidemiology, prevention, treatment services, and recovery research to practice. Proposed studies may target the individual, provider, organizational, community, or system level. This initiative prioritizes replicable and scalable approaches for accelerating the routine use of effective, evidence-based prevention, treatment and recovery interventions and services. The translation of research to practice and research relevant to chronic pain comorbid with substance use is also a priority. Research may deploy a variety of methods and approaches, including but not limited to identifying and characterizing malleable factors, developing and testing interventions and implementation strategies, deploying and testing collaborative data science approaches, and/or developing and testing approaches that integrate the collaboration of researchers and decision-makers at any levels (e.g., clinical-, health system-, public health- or policy-level).", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360881", "kind": "Funding opportunity", "number": "RFA-CA-27-012", "title": "Metastasis Research Network (U54 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-04", "deadline": "2026-09-25", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360881", "description": "Through this Notice of Funding Opportunity (NOFO), the National Cancer Institute (NCI) solicits applications for research on developing a comprehensive and cohesive understanding of cancer metastasis. Towards this goal, the NCI will support U54 Specialized Centers that together will continue to serve as the hub of the Metastasis Research Network (MetNet). Each MetNet Center should propose an overarching scientific theme that will be pursued through two or three scientific inter- and multidisciplinary basic research projects. The projects should use integrative system level approaches to elucidate and integrate a mechanistic understanding of the non-linear, dynamic, and emergent processes in metastasis. Overarching themes should encompass the interplay between at least two central elements in the metastatic process such as early dissemination, cellular, soluble and/or physical microenvironment crosstalk, dormancy, or mechanisms of responses by metastatic cells to therapies. Studies on all types of cancer are welcome, including rare and pediatric metastatic cancers.Research proposed by MetNet Centers is expected to advance our understanding towards a more comprehensive appreciation of metastasis as a whole body, systems-level problem.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360626", "kind": "Funding opportunity", "number": "RFA-DK-27-108", "title": "Continuation of the Cardiovascular Repository for-Type 1 Diabetes (CARE-T1D) Consortium U01 (Open Competition)- Research (U01, Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-04", "deadline": "2027-03-10", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360626", "description": "The NIH Cardiovascular Repository for Type 1 Diabetes (CaRe-T1D) was created to improve research on type 1 diabetes (T1D) and cardiovascular disease (CVD). Cardiovascular complications remain the top cause of death among people with T1D and greatly shorten lifespan. The mechanisms underlying atherosclerosis, cardiomyopathy, endothelial dysfunction, and cardiac autonomic neuropathy in T1D remain poorly understood. While managing traditional risk factors—such as high blood glucose, high blood pressure, and elevated cholesterol lower cardiovascular risk, a significant residual risk remains even with optimal control. In addition to atherosclerosis, both diastolic and systolic diabetic cardiomyopathy play a major role in morbidity and mortality among these patients. Currently, no therapies are specifically approved to prevent or treat these common and severe cardiovascular issues in T1D. The purpose of this NOFO is to promote collaborative and interdisciplinary research aimed at enhancing the understanding of the development of CVD in individuals with T1D and the differences with CVD in T1D by continuing the efforts of the CaRe-T1D consortium.This NOFO is associated with the Special Diabetes Program (https://www.niddk.nih.gov/about-niddk/research-areas/diabetes/type-1-diabetes-special-statutory-funding-program/about-special-diabetes-program) which funds research on the prevention, treatment, and cure of type 1 diabetes and its complications, including unique, innovative, and collaborative research consortia and clinical trials networks.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:361035", "kind": "Funding opportunity", "number": "RFA-DK-27-109", "title": "Single Source Competition: Continuation of the Cardiovascular Repository for Type 1 Diabetes (CaRe-T1D) - Resource Center (U24 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-04", "deadline": "2026-09-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361035", "description": "This Notice of Funding Opportunity (NOFO) invites a single cooperative agreement application for the Resource Center for the Cardiovascular Repository for Type 1 Diabetes (CaRe-T1D). The purpose of CaRe-T1D is to support innovative, discovery and mechanistic research through the study of human cardiovascular (CV) tissue. This research seeks to better understand cardiovascular disease (CVD) in type 1 diabetes, highlight differences compared to type 2 diabetes, and ultimately guide the development of therapies to treat this major cause of morbidity and mortality for individuals with type 1 diabetes. To achieve these goals, the Resource Center will expand the CaRe-T1D biorepository of human CV tissue, further develop the data commons for data sharing and for artificial intelligence (AI) tools, coordinate the research activities of the investigative teams in the CaRe-T1D consortium, and make CaRe-T1D resources accessible to the broader research community. This NOFO is associated with the Special Diabetes Program (https://www.niddk.nih.gov/about-niddk/research-areas/diabetes/type-1-diabetes-special-statutory-funding-program/about-special-diabetes-program) which funds research on the prevention, treatment, and cure of type 1 diabetes and its complications, including unique, innovative, and collaborative research consortia and clinical trials networks.This is a Notice of Funding Opportunity (NOFO) for a Single Source that will invite application(s) from eligible organization(s) to apply. Please see Section III. Eligibility for additional information. In accordance with NIH standard peer-review processes, the application(s) will be peer-reviewed, and only meritorious application(s) will be considered for funding.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359949", "kind": "Funding opportunity", "number": "RFA-HD-27-006", "title": "Novel Experiential Technologies Assisting Individual Learning (NExT AI) Hubs (P20 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-03", "deadline": "2026-10-02", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359949", "description": "This Notice of Funding Opportunity (NOFO) invites exploratory grant applications, hereafter referred to as the Novel Experiential Technologies Assisting Individual learning Hubs or NExT AI Hubs (formerly Learning Disabilities Innovation Hubs), to address the impact of Artificial Intelligence (AI) technologies on developmental outcomes in children diagnosed with or at risk for developing a specific learning disability (SLD) impacting reading, writing, and mathematics. NExT AI Hubs include a single Research Project and a Leadership Core that support the goals and aims of the Hub. This NOFO seeks to serve as a catalyst to 1) speed the maturation of nascent/novel, high-impact, high-risk research that advances understanding of the role AI technology plays in supporting, improving, or limiting the learning, cognitive, and socio-emotional needs of children at risk for or diagnosed with SLDs, 2) build an evidence base for the SLD community to inform policy or practice, and 3) provide project-embedded, career-enhancing research and professional development opportunities to support the next generation of transdisciplinary SLD scientists. This initiative provides opportunities to support planning and building a body of research and corresponding intellectual infrastructure to enable NExT AI investigators to compete for large research and program project opportunities in the future.This NOFO aims to integrate research topics that are of relevance to various research programs at the Eunice Kennedy Shriver National Institute of Child Health and Human Development (NICHD) and align with the NICHD Strategic Plan. The NOFO intends to build cross-programmatic, transdisciplinary and cross-cutting scientific research, and critically nurture the development of early career investigators capable of conducting this research.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360534", "kind": "Funding opportunity", "number": "RFA-CA-27-002", "title": "Advanced Development and Validation of Emerging Technologies for Basic and Clinical Cancer Research (R33 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-03", "deadline": "2026-11-10", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360534", "description": "Through this Notice of Funding Opportunity (NOFO), the National Cancer Institute (NCI) invites grant applications proposing exploratory research projects focused on further development and technical validation of emerging technologies offering novel capabilities for the molecular or cellular characterization of cancer or for improved handling and quality control of biospecimens used for basic, clinical, or epidemiological cancer research. This NOFO solicits R33 applications where major feasibility gaps for the technology or methodology have been overcome, as demonstrated with supportive preliminary data, but still require further development and rigorous technical validation to encourage adoption by the research community. Well-suited applications must propose the development of technologies that offer the potential to accelerate and/or enhance research in the areas of cancer biology, early detection and screening, clinical diagnosis, treatment, cancer control, epidemiology. Technologies proposed for development may have potential for widespread applicability but must be focused in this proposal on cancer-relevant use cases. Projects proposing to apply or use existing technologies for hypothesis-driven research where the novelty resides in the biological or clinical target/question being pursued are not responsive to this solicitation and will not be reviewed.This funding opportunity is part of a broader NCI-sponsored Innovative Molecular Analysis Technologies (IMAT) Program.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360536", "kind": "Funding opportunity", "number": "RFA-CA-27-001", "title": "Early-Stage Innovative Technology Development for Basic and Clinical Cancer Research (R61 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-03", "deadline": "2026-11-10", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360536", "description": "Through this Notice of Funding Opportunity (NOFO), the National Cancer Institute (NCI) solicits grant applications proposing to develop innovative technologies offering new capabilities for the molecular or cellular characterization of cancer or for improved handling and quality control of biospecimens for basic, clinical, or epidemiological cancer research. The NOFO solicits R61 applications for early-stage projects proposing proof-of-concept/pilot studies to test the technical feasibility of the proposed method, tool, assay, platform, or instrument. Technologies proposed for development may have potential for widespread applicability but must be focused for this program on cancer-relevant use cases. Projects proposing to apply or use existing technologies for hypothesis-driven research where the novelty resides in the biological or clinical target/question being pursued are not responsive to this solicitation and will not be reviewed.This funding opportunity is part of a broader NCI-sponsored Innovative Molecular Analysis Technologies (IMAT) Program.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360583", "kind": "Funding opportunity", "number": "PAR-27-111", "title": "Biological Testing Facility for Contraception & Reproductive Health (X01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-01", "deadline": "2029-05-07", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360583", "description": "The purpose of this notice of funding opportunity (NOFO) is to provide investigators with a mechanism to request services from the state-of-the-art Biological Testing Facility that would advance their contraceptive development or reproductive health programs. This NOFO aims to position innovative and validated methods for future regulatory submission and/or clinical development. Applicants do not need to have current NIH funding to apply, but priority may be given to programs receiving NIH support at the time of application submission.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:358824", "kind": "Funding opportunity", "number": "PAR-27-074", "title": "Limited Competition: Small Grant Program for Mentored Research Career Development Award Recipients (R03) (Clinical Trials Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-28", "deadline": "2029-07-16", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/358824", "description": "The National Institute of Arthritis and Musculoskeletal and Skin Diseases (NIAMS) announces a program that provides NIAMS-supported K01, K08, K23, and K25 recipients the opportunity to apply for the Small Grant (R03) during the second to fourth year of their K award, as well as to provide support to recipients of significant career development awards from federal or non-federal organizations that are focused on the NIAMS' mission areas. Through this mechanism, which allows up to $50,000 direct costs per year for up to two years, the NIAMS is seeking to enhance the capability of scientists to conduct research as they transition to fully independent investigator. The R03 grant mechanism allows support of different types of projects, including pilot and feasibility studies; secondary analysis of existing data; small, self-contained research projects; development of research methodology; and development of new research technology. In addition to the existing career development awards, the R03 is intended to support short term research projects to enable opportunities for a subsequent R01, or equivalent, application. Clinical trials of any phase will not be supported by this NOFO.This is a Notice of Funding Opportunity (NOFO) for a Limited Competition that will invite application(s) from eligible organization(s) to apply. Please see Section III. Eligibility for additional information. In accordance with NIH standard peer-review processes, the application(s) will be peer-reviewed, and only meritorious application(s) will be considered for funding.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359159", "kind": "Funding opportunity", "number": "RFA-MH-27-140", "title": "Optimizing Behavioral Sleep Interventions for Adolescents and Young Adults (R34 Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-05-28", "deadline": "2026-10-22", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359159", "description": "NIMH seeks applications for pilot research to adapt, optimize, and test behavioral interventions that address common sleep problems in adolescents and young adults with or at risk for a mental health disorder. This notice of funding opportunity (NOFO) supports pilot clinical trials designed to evaluate the feasibility, tolerability, acceptability, safety, and potential effectiveness of the approach in real world settings. Applications should aim to conduct a preliminary test of the intervention's impact on sleep and mental health outcomes, as well as an examination of the mechanisms that underlie the intervention's effectiveness, and to obtain preliminary data needed as a prerequisite for larger-scale effectiveness trials. In addition, interdisciplinary, collaborative teams of investigators from the fields of mental health, sleep medicine, developmental science, clinical trials research methods, behavioral economics, implementation science, data science, and human computer interaction are encouraged.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359149", "kind": "Funding opportunity", "number": "RFA-OD-27-006", "title": "Maximizing the Scientific Value of Data Generated by the Environmental influences on Child Health Outcomes (ECHO) Program: Dissertation Grant (R36 - Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-28", "deadline": "2026-10-15", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359149", "description": "The goal of this NOFO is to support doctoral candidates studying high-priority areas of child health for the completion of their doctoral dissertation research project. This NOFO seeks to advance research in child health by stimulating the use of Environmental Influences on Child Health (ECHO) Cohort data by doctoral students in relevant scientific areas. This RFA will provide students working on dissertations the opportunity to access the ECHO data within the NICHD Data and Specimen Hub (DASH) repository. ECHO\"s DASH dataset integrates de-identified longitudinal data from more than 71,000 participants across the U.S. Prenatal and child exposure data include physical, chemical, social, behavioral, and biological factors. ECHO\"s five primary pediatric outcome areas are pre-, peri-, and postnatal outcomes, upper and lower airway, obesity, neurodevelopment, and positive health. This award will facilitate the entry of promising new investigators into the field of early environmental exposures and child health research, enhancing the pool of highly talented researchers.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359150", "kind": "Funding opportunity", "number": "RFA-OD-27-008", "title": "Maximizing the Scientific Value of Data Generated by the Environmental Influences on Child Health Outcomes (ECHO) Program: Ruth L. Kirschstein National Research Service Award (NRSA) Individual Postdoctoral Fellowship (F32)", "agency": "National Institutes of Health", "posted": "2026-05-28", "deadline": "2026-12-02", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359150", "description": "This NOFO seeks to advance research and training in high-priority areas of child health by stimulating the use of Environmental Influences on Child Health Outcomes (ECHO) Cohort data by postdoctoral fellows from relevant scientific disciplines. This RFA will provide opportunities for fellows to study child health outcomes through the analysis of ECHO's large longitudinal data sets within the NICHD Data and Specimen Hub (DASH) repository. ECHO's DASH dataset integrates de-identified longitudinal data from more than 71,000 participants across the U.S. Prenatal and child exposure data include physical, chemical, social, behavioral, and biological factors. ECHO's five primary pediatric outcome areas are pre-, peri-, and postnatal outcomes, upper and lower airway, obesity, neurodevelopment, and positive health.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:362581", "kind": "Funding opportunity", "number": "PAR-27-062", "title": "Academic Career Excellence (ACE) Award (K32 Independent Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-27", "deadline": "2029-07-12", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/362581", "description": "The purpose of the Academic Career Excellence (ACE) Award (K32) is to support rigorous, mentored scientific research and career development for up to three years for early-stage postdoctoral scholars. Candidates must submit their application up to one year prior to beginning their postdoctoral position or no more than two years after their postdoctoral training begins (resubmissions included). The ACE K32 will foster early, goal-directed planning and encourage innovative applications with the potential for a significant impact on scientific research and career development. Inclusion of preliminary data are not required as the ACE K32 emphasizes innovative research ideas and thoughtful plans for training and mentorship that will facilitate the development of the postdoctoral scholars who have the potential to become productive, independent investigators in research fields relevant to the missions of the participating NIH Institutes and Centers.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360380", "kind": "Funding opportunity", "number": "RFA-DA-27-015", "title": "Establishing a Center for the Advancement of Substance Use Disorder (SUD) Pharmacotherapeutics through Training and Preclinical Support (U54 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-21", "deadline": "2026-09-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360380", "description": "The purpose of this notice of funding opportunity (NOFO) is to establish a Center that trains researchers in formal product development for new substance use disorder (SUD) pharmacotherapeutics and to advance the best concepts through initial experiments via technical and financial support.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359892", "kind": "Funding opportunity", "number": "RFA-CA-27-019", "title": "Early-Stage Development of Informatics Technologies for Cancer Research and Management (U01 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-05-21", "deadline": "2027-10-19", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359892", "description": "This Notice of Funding Opportunity (NOFO) solicits applications for the development of enabling informatics technologies to improve the acquisition, management, analysis, and dissemination of data and knowledge across the cancer research continuum including cancer biology, cancer treatment and diagnosis, early cancer detection, risk assessment and prevention, cancer control and epidemiology. As a component of the NCI's Informatics Technology for Cancer Research (ITCR) Program, this NOFO is focused on early-stage development from prototyping to initial dissemination. Early-stage development is defined for the purpose of this NOFO as initial tool development or the significant modification of existing tools for new applications. The central mission of ITCR is to promote research-driven informatics technology across the development lifecycle to address priority needs in cancer research. In order to be successful, proposed development plans must have a clear rationale for why the proposed technology is needed and how it will benefit the cancer research field. In addition, mechanisms to solicit feedback from driving research projects and other users throughout the development process must be included.This NOFO encourages applications that involve the development of new, user-friendly informatics technologies that support a wide range of cancer research, including discovery biology, population studies, as well as clinical and translational research. The emphasis is on uniqueness and potential impact on cancer research. In addition, all projects proposed in response to this NOFO must involve the following general attributes:Potential to advance driving cancer research projects and the cancer research field in generalNovel informatics capabilities for the targeted cancer research domainCompelling plans and processes for engaging end users to evaluate and apply the tool or resourceA realistic timeline and milestones for technology development", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:358963", "kind": "Funding opportunity", "number": "RFA-CA-27-006", "title": "NCI Community Oncology Research Program (NCORP) Research Bases (UG1 Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-05-21", "deadline": "2026-09-18", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/358963", "description": "This Notice of Funding Opportunity (NOFO) is one of three NOFOs for the National Cancer Institute (NCI) Community Oncology Research Program (NCORP). NCORP is designed to enhance generalizability and dissemination of clinical trial and other human subject research study results through accrual in a variety of community settings. The purpose of NCORP is to engage cancer patient populations, those at risk of cancer, and organizations in rigorous studies focused on cancer control, prevention, treatment and care delivery.NCORP is a community-based research network that:Designs and conducts clinical trials and other human subject studies for adults and children in cancer control, prevention, screening, and care delivery, as well as quality-of-life studies embedded within treatment trials;Enhances patient and provider access to treatment and imaging trials conducted under the National Clinical Trials Network (NCTN);NCORP will support the following components that will be individually awarded through the respective Request for Applications (RFAs) indicated below:NCORP Research Bases (UG1 Clinical Trials Required)(covered by this NOFO);NCORP Community Sites (UG1 Clinical Trials Not Allowed); andNCORP Academic Community Sites (UG1 Clinical Trials Not Allowed).NCORP Research Bases will serve as the program's research hubs and are expected to:Provide an established organizational structure, with scientific and statistical leadership for developing, implementing, and analyzing multi-institutional cancer control, prevention, and care delivery (CCP&CD) clinical research, as well as quality-of-life studies embedded in treatment and imaging studies.Assume responsibility for study operations and data management, including efficient protocol development; compliance with Food and Drug Administration (FDA) and Office of Human Research Protections (OHRP) regulatory and participant protection requirements; auditing; training; quality assurance; and support to Community Sites and Academic Community Sites.Be based at institutions with comprehensive cancer clinical research expertise (e.g., NCI-designated Cancer Center, or healthcare research organization – including NCI's National Clinical Trials Network (NCTN) Group Operations Centers, or a cancer foundation associated with a NCTN Group).", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:362488", "kind": "Funding opportunity", "number": "PAR-28-019", "title": "Integrated Specific Pathogen Free Research Models and Human New Approach Methodologies to Advance HIV/AIDS Research (U42 Clinical Trial Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-05-20", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/362488", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:358917", "kind": "Funding opportunity", "number": "RFA-DK-27-147", "title": "Single Source for Continuation of the Integrated Islet Distribution Program U24 (Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-20", "deadline": "2026-09-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/358917", "description": "This is a NOFO for a Single Source competition that will invite application(s) from eligible organization(s) to apply. Please see Eligibility Section for additional information. In accordance with NIH standard peer-review processes, the application(s) will be peer-reviewed, and only meritorious application(s) will be considered for funding.The National Institute of Diabetes and Digestive and Kidney Diseases (NIDDK) is announcing its intent to issue a single source cooperative agreement award to Beckman Research Institute/City of Hope for the currently funded Integrated Islet Distribution Program (IIDP) to renew the program and maintain support for its continuing mission to provide the scientific community with important islet resources for diabetes research. The IIDP facilitates the distribution of human islets to biomedical researchers by establishing partnerships with qualified islet isolation facilities to prepare and distribute human islets. Human islets remain an essential resource for diabetes research to advance our understanding of human islet cell biology, and to promote the development of new therapies for the prevention and treatment of diabetes.This NOFO is associated with the Special Diabetes Program (https://www.niddk.nih.gov/about-niddk/research-areas/diabetes/type-1-diabetes-special-statutory-funding-program/about-special-diabetes-program) which funds research on the prevention, treatment, and cure of type 1 diabetes and its complications, including unique, innovative, and collaborative research consortia and clinical trials networks.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359696", "kind": "Funding opportunity", "number": "RFA-DC-27-003", "title": "Transformative Non-Invasive/Minimally Invasive Technologies for Imaging the Olfactory System Across Scales (R01 CT Optional)", "agency": "National Institutes of Health", "posted": "2026-05-20", "deadline": "2028-08-21", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359696", "description": "The National Institute on Deafness and Other Communication Disorders (NIDCD), with the National Institute of Biomedical Imaging and Bioengineering (NIBIB) aims to support the development and/or adaptation of transformative in vivo high-resolution/high specificity imaging of the human olfactory system. Currently, there are limited non-invasive/minimally invasive technologies available for imaging the living human peripheral and central olfactory system with high spatial and temporal resolution. Imaging the olfactory system in the laboratory and in the clinic is essential to understanding underlying biological mechanisms as well as the etiology of an olfactory disorder. Such imaging has proven challenging due to the olfactory system\"s unique anatomical and functional characteristics such as restricted accessibility, multiple cell types, and low signal resolution. Addressing these challenges requires multimodal approaches including leveraging existing advanced tools and technologies and developing new tools tailored for the olfactory system. Recent advances in minimally invasive and non-invasive imaging technologies, such as cell specific biomarkers, fluorescence imaging, specialized endoscopes, optical and acoustic imaging, molecular imaging, and hemodynamic and diffusion imaging have the potential to transform our ability to image and investigate the peripheral and central olfactory system in the living human with superior temporal and spatial resolution and eventually improve diagnostic accuracy of olfactory disorders. Applications must leverage advanced non-invasive/minimally invasive imaging technologies to visualize peripheral (e.g., olfactory- and non-olfactory epithelium) and central olfactory (e.g., olfactory bulb) targets at a level previously unattainable. In addition, projects should engage multidisciplinary teams combining expertise in olfaction, biomedical imaging, biochemistry, bioengineering, and biophysics, as appropriate.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360655", "kind": "Funding opportunity", "number": "RFA-OD-27-005", "title": "INCLUDE Project: Clinical Trials Phased Awards for Down syndrome Research (R61/R33 Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-05-13", "deadline": "2028-06-15", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360655", "description": "The NIH INvestigation of Co-occurring conditions across the Lifespan to Understand Down syndromE (INCLUDE) Project seeks to improve health and quality-of-life for individuals with Down syndrome. The purpose of this Notice of Funding Opportunity (NOFO) encourages Exploratory/Developmental Phased Innovation (R61/R33) grant applications to support development of clinical trials to treat critical and co-occurring health conditions in individuals with Down syndrome. The proposed research aims should be milestone-driven. The total project period for an application submitted in response to this NOFO may not exceed five years. This NOFO provides support for up to two years (R61 phase) for preliminary/developmental/planning studies, followed by possible transition to clinical trial support (R33) of up to three years, although the total duration of the award may not exceed five years. This NOFO requires measurable R61 milestones.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360593", "kind": "Funding opportunity", "number": "PAR-27-032", "title": "Maximizing Investigators’ Research Award (MIRA) for Early Stage Investigators (ESI)", "agency": "National Institutes of Health", "posted": "2026-05-12", "deadline": "2029-02-06", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360593", "description": "The Maximizing Investigators' Research Award (MIRA) for Early Stage Investigators (ESIs) provides support for ESIs with a program of research that aligns with the NIGMS mission.MIRA distributes funding among promising investigators across the country. The goal is to boost scientific productivity and the chances for important breakthroughs.Through this program, investigators can:Receive independent research funding early to start and sustain strong research careers.Explore new, unique research areas in the NIGMS mission.Take on ambitious, creative projects.Shift focus to include emerging techniques and technologies as needed.Devote more time to mentoring trainees in a stable research environment.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360654", "kind": "Funding opportunity", "number": "RFA-OD-27-004", "title": "INCLUDE Project: Transformative Research Awards for Down syndrome (R01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-12", "deadline": "2028-06-15", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360654", "description": "The NIH INvestigation of Co-occurring conditions across the Lifespan to Understand Down syndromE (INCLUDE) Project seeks to improve health and quality-of-life for individuals with Down syndrome. The purpose of this Notice of Funding Opportunity (NOFO) is to solicit Transformative Research Award applications to support individual scientists or groups of scientists proposing groundbreaking, exceptionally innovative, original, and/or unconventional research that has the potential to create new scientific paradigms, establish entirely new and improved clinical approaches, or develop transformative technologies related to Down syndrome. Applications are welcome in all topics relevant to Down syndrome-related research or its co-occurring conditions. No preliminary data are required. Projects must clearly demonstrate, based on the strength of the logic, a compelling potential to produce a major impact in research related to Down syndrome.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360653", "kind": "Funding opportunity", "number": "RFA-OD-27-003", "title": "INCLUDE Project: Exploratory/Developmental Research Awards for Down syndrome (R21 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-12", "deadline": "2028-06-15", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360653", "description": "The NIH INvestigation of Co-occurring conditions across the Lifespan to Understand Down syndromE (INCLUDE) Project seeks to improve health and quality-of-life for individuals with Down syndrome. This Notice of Funding Opportunity (NOFO) invites researchers to submit applications for support of new exploratory and developmental research projects that address critical needs for Down syndrome projects, as articulated in the INCLUDE Project objectives. For example, such projects could assess the feasibility of a novel area of investigation or a new experimental system that has the potential to enhance health-related research. Another example could include the unique and innovative use of an existing methodology to explore a new scientific area. These studies may involve considerable risk but may lead to a breakthrough in a particular area, or to the development of novel techniques, agents, methodologies, models, or applications that could have a major impact on a field of biomedical, behavioral, or clinical research.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359675", "kind": "Funding opportunity", "number": "RFA-HL-27-004", "title": "Limited Competition: Small Grant Program for NHLBI K01/K08/K23/K25 Recipients (R03 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-05-12", "deadline": "2028-11-07", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359675", "description": "This is a Notice of Funding Opportunity (NOFO) for a Limited Competition that invites applications from eligible organizations to apply. Please see Section III. Eligibility for additional information. In accordance with NIH standard peer-review processes, the applications will be peer-reviewed, and only meritorious applications will be considered. The purpose of this NOFO is to solicit current or recently completed NHLBI K01, K08, K23, and K25 awardees for small grant support to expand their current research objectives or to branch out to a new study emerging from their K award research. This NOFO is intended to facilitate the transition to research independence for these NHLBI K awardees. Current NHLBI K01, K08, K23, and K25 awardees may apply for this R03 support starting in the third year of their K award Project Period. Recently completed NHLBI K01, K08, K23, and K25 award recipients are eligible to apply or resubmit A1 applications if the earliest potential R03 award start date is within two years of the end of their K award Project Period.The R03 grant mechanism supports research projects that can be completed within two years and with limited resources. These projects are expected to generate preliminary data to bolster a subsequent R01-equivalent application. Eligible projects include, but are not limited to, pilot or feasibility studies; proof of concept studies; secondary analysis of existing data; small, self-contained research projects; development of new research methodologies or technologies, or creation of novel experimental model systems.Applicants are required to maintain a minimum of 40% protected research effort during the R03 award period. This requirement can be fulfilled through a combination of effort on the proposed R03 project and other research projects, irrespective of funding source.For current and former K23 awardees, the research proposed in the R03 application may or may not include patient-oriented research.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359732", "kind": "Funding opportunity", "number": "PAR-27-082", "title": "NIAID Investigator Initiated Program Project Applications (P01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-07", "deadline": "2029-05-25", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359732", "description": "This notice of funding opportunity (NOFO) invites submission of investigator-initiated Program Project (P01) applications. The proposed Programs should address scientific areas relevant to the NIAID mission including: biology and pathogenesis of infectious microbes, including HIV; host-microbe interactions; mechanisms regulating immune system development and function across the lifespan, and in response to infectious pathogens; immune dysfunction resulting in allergy, asthma, autoimmunity, immunodeficiency, or transplant rejection; and translational research to develop vaccines, therapeutics, and diagnostics to prevent and treat infectious and immune-mediated diseases. Each application submitted to this NOFO must include at least two related, synergistic Research Projects that share a common central theme, focus, and/or overall objective; and an Administrative Core. An application may include Scientific Core(s), if needed for the proposed research.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359692", "kind": "Funding opportunity", "number": "PAR-27-083", "title": "NIAID Resource-Related Research Projects (R24 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-05-07", "deadline": "2029-05-25", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359692", "description": "This notice of funding opportunity (NOFO) invites applications for investigator-initiated Resource-Related Research Projects (R24). The proposed resource must provide a significant benefit to currently funded high priority projects in need of further coordination and support in the areas specified. This mechanism may also be used to support development of a new resource to the broader scientific community of the National Institute of Allergy and Infectious Diseases (NIAID). It is anticipated that the request for resource support through the R24 activity code will occur on an infrequent basis and only in circumstances where other mechanisms of support from the NIAID are not appropriate.The proposed resources should be relevant to the scientific areas of the NIAID mission including the biology, pathogenesis, and host response to microbes, including HIV; the mechanisms of normal immune function and immune dysfunction resulting in autoimmunity, immunodeficiency, allergy, asthma, and transplant rejection; and translational research to develop vaccines, therapeutics, and diagnostics to prevent and treat infectious, immune-mediated, and allergic diseases.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359703", "kind": "Funding opportunity", "number": "PA-27-034", "title": "NIH Research Education Program - Courses, Curriculum & Methods (Parent R25 - Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-08", "deadline": "2029-05-25", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359703", "description": "The National Institutes of Health (NIH) Research Education Program supports research education activities in the mission areas of the NIH. The overarching goal of the Research Education program is to:Support educational activities that complement and/or enhance training of a workforce to meet the nation's biomedical, behavioral and clinical research needs;Help recruit individuals with specific specialty or disciplinary backgrounds to research careers in biomedical, behavioral and clinical sciences; andFoster a better understanding of biomedical, behavioral and clinical research and its implications.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 2, "topics": [], "matches": [], "excluded": []}], "updated": "2026-09-04T16:54:54+00:00", "errors": ["NIH Guide: HTTP Error 406: Not Acceptable"]}</script><script>
