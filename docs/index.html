<script id="feed-data" type="application/json">{"items": [{"id": "grant:359277", "kind": "Funding opportunity", "number": "RFA-HG-27-009", "title": "Genomic Variant Interactions With Other Variants Or The Environment (UM1 Clinical Trials Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-10-09", "deadline": "2026-12-14", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359277", "description": "The purpose of this Notice of Funding Opportunity (NOFO) is to solicit applications to study the effects of genetic or environmental interactions on genomic variant impact. To accomplish this, interaction centers will first propose a research framework to investigate whether interactions with effects beyond additive are important modifiers of the impact of variants. Centers will apply their framework to experimentally test combinations for interactions and share their data as well as analyses through the Impact of Genomic Variation on Function (IGVF) portal and catalog. Centers will share their method for predicting the most important combinations for future testing. The rationale for this combination of research and resource work is the identification of a structure within the interaction landscape might result in better predictions of the most important interactions to test, leading to more effective variant testing, better understanding of genome-wide association studies (GWAS), and improved polygenic scores. As IGVF Consortium members, centers will work together to ensure all consortium resources are accessible to a wide variety of potential users. Centers are also expected to collaborate with other consortium components to coordinate assays, variants, and cell types, and to develop shared analysis strategies to meet consortium goals.", "source": "Grants.gov", "first_seen": "2026-10-09", "is_new": true, "score": 7, "topics": ["omics and genetics"], "matches": ["genome-wide", "gwas"], "excluded": []}, {"id": "grant:359168", "kind": "Funding opportunity", "number": "RFA-RM-27-007", "title": "Cellular Senescence Network (SenNet): SenNet Technology Projects (SenTecs) (UG3/UH3 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-10-09", "deadline": "2026-11-23", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359168", "description": "The purpose of this Notice of Funding Opportunity (NOFO) is to solicit the development of innovative senescence technologies (SenTecs), or the adaptation of existing technologies focused on identification, characterization and understanding the biological consequences of senescent cell (SnC) heterogeneity in the context of the tissue environments and secretomes to facilitate novel strategies for modulating SnCs in vivo and for predicting the outcomes of targeting SnCs in human aging and in disease conditions. These are five-year, milestone-driven awards consisting of two phases. The first two years constitute the UG3 phase and are focused on SenTec development and demonstration of technology feasibility. The following 3-years is the SenTec application UH3 phase where SenTecs continue to be optimized, refined and validated. In the final year of the UH3 award, SenTecs will undertake a demonstration project conducted in a collaborative effort within SenNet to provide further validation of the proposed SenTec. Applicants are required to submit both UG3 and UH3 projects together when responding to this NOFO. Transition from the UG3 to UH3 phases is not automatic and will occur only after administrative review of each SenTec at the close of Year 2 of the award.", "source": "Grants.gov", "first_seen": "2026-10-09", "is_new": true, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359152", "kind": "Funding opportunity", "number": "RFA-AR-28-001", "title": "NIAMS P30 Centers Program (P30 - Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-10-09", "deadline": "2029-03-01", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359152", "description": "The overall goal of this program is to accelerate scientific discovery, improve research efficiency, and enhance the translation of research findings into improved health outcomes. Centers funded under this program will also foster multidisciplinary collaboration, support workforce development across career stages, and promote training in emerging areas such as data science, artificial intelligence, and implementation research. The National Institute of Arthritis and Musculoskeletal and Skin Diseases (NIAMS) requests applications for the NIAMS P30 Centers Program to support integrated research Centers within its mission areas of skin biology and diseases; bone, muscle, and orthopaedic research; and rheumatic diseases. The NIAMS P30 Centers Program supports Centers that provide coordinated research infrastructure, shared resources, and methodological expertise to advance basic, translational, and clinical research. These Centers are expected to integrate state-of-the-art research resources with capabilities that support clinical and translational research, including the development, testing, and dissemination of novel analytical methods, study designs, outcome measures, and data-driven approaches.", "source": "Grants.gov", "first_seen": "2026-10-09", "is_new": true, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360562", "kind": "Funding opportunity", "number": "RFA-DA-28-013", "title": "Neural Ensembles & Used Substances (NExUS) Collaboratory: Building a Multimodal Inventory of Cell Ensembles Encoding the Effects of Addictive Substances (U01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-10-09", "deadline": "2027-02-08", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360562", "description": "The National Institute on Drug Abuse (NIDA) invites applications to renew and expand the Collaboratory on Neural Ensembles and Used Substances (NExUS). NExUS is a collaborative research program to decode how substance use experiences and addictive neurobehavioral states are represented in the brain at the level of cell populations. This funding opportunity seeks applications that propose systematic and scalable methods to identify, map, and analyze groups of neurons that respond to used substances. The goal is to create a comprehensive, multimodal database and use it to test hypotheses about how specific neural population activity patterns relate to behavioral states associated with substance use and substance use disorders (SUD), including intoxication, craving, and dependence.", "source": "Grants.gov", "first_seen": "2026-10-09", "is_new": true, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359170", "kind": "Funding opportunity", "number": "RFA-HG-27-010", "title": "Computational Modeling and Analysis of the Impact of Genomic Variation on Function (UM1, Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-10-09", "deadline": "2026-12-14", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359170", "description": "The purpose of this Notice of Funding Opportunity (NOFO) is to solicit applications to develop, apply, and test predictive models and perform integrative analyses to determine the impact of genomic variation on genome function. Centers funded through this initiative will become a part of the Impact of Genomic Variation on Function (IGVF) Consortium. As consortium members, centers will work together to ensure all consortium resources are accessible to a wide variety of potential users. Centers also will collaborate with other consortium components to guide and optimize IGVF experimental design, to provide analytical expertise and support for consortium-wide efforts, and to develop and execute shared analysis strategies to meet consortium goals.", "source": "Grants.gov", "first_seen": "2026-10-09", "is_new": true, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:358854", "kind": "Funding opportunity", "number": "RFA-HG-27-007", "title": "Systematic Characterization of Genomic Variation to Assess Effects of Individual Variants on Genome Function and Phenotype (UM1 Clinical Trials Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-10-09", "deadline": "2026-12-14", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/358854", "description": "The purpose of this Notice of Funding Opportunity (NOFO) is to solicit applications to characterize genomic variation to assess the impact of individual variants on genome function. This will be accomplished by systematically perturbing variants or elements using one or more high-throughput methods; collecting data on the effects of variants in DNA, RNA, or protein-coding elements on molecular, cellular, or organismal phenotypes; and developing robust, reproducible, and portable data processing pipelines. Centers funded through this initiative will become a part of the Impact of Genomic Variation on Function (IGVF) Consortium. As consortium members, centers will work together to ensure all consortium resources are accessible to a wide variety of potential users. Centers are also expected to collaborate with other consortium components to coordinate assays, variants, and cell types, and to develop shared analysis strategies to meet consortium goals.", "source": "Grants.gov", "first_seen": "2026-10-09", "is_new": true, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363210", "kind": "Funding opportunity", "number": "RFA-HD-28-003", "title": "Elucidation and Validation of the role of Transporters in the Placenta, Lactating Mammary Gland, Developing Gut, and Blood Brain Barrier", "agency": "HHS-NIH11", "posted": "2026-07-16", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363210", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 7, "topics": ["human milk and lactation"], "matches": ["lactating", "mammary gland"], "excluded": []}, {"id": "grant:361164", "kind": "Funding opportunity", "number": "PAR-27-071", "title": "Discovery of the Genetic Basis of Childhood Cancers and of Congenital Anomalies: Gabriella Miller Kids First Pediatric Research Program (X01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-18", "deadline": "2027-01-11", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361164", "description": "As part of the Gabriella Miller Kids First Pediatric Research Program (Kids First Program), the NIH invites applications to submit samples from pediatric cohorts for whole genome sequencing at a Kids First Program supported genomic data generating centers. Applicants are encouraged to propose sequencing of existing pediatric cancer or congenital anomaly cohorts to elucidate the genetic contribution (somatic and/or germline) to childhood cancers, to investigate the genetic etiology of congenital anomalies, to study the molecular basis of the associations between congenital anomalies and increased cancer risk, or to expand the range of pediatric disorders included within the Kids First Data Resource. The program will accept applications that propose whole genome, exome, and transcriptome sequencing, as well as clinical-grade sequencing, long-read sequencing, proteomics, and epigenomic assays of tumor or affected tissue, when justified. Applicants are encouraged to propose cohorts to increase representation of existing Kids First Program projects. These data, and associated clinical and phenotypic data, will become part of the Kids First Data Resource Center for sharing with the research community.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 7, "topics": ["omics and genetics"], "matches": ["proteomics", "sequencing"], "excluded": []}, {"id": "grant:359740", "kind": "Funding opportunity", "number": "RFA-AG-27-010", "title": "Data Coordinating Center for the Aging and Alzheimer’s Disease Mouse Brain Atlas (AD-MBA) (U24 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-01", "deadline": "2026-11-10", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359740", "description": "This Notice of Funding Opportunity (NOFO) invites applications proposing a Data Coordinating Center that integrates and disseminates multiscale mouse brain datasets for the aging and Alzheimer's disease (AD) research community. The Data Coordinating Center will establish the Aging and AD Mouse Brain Atlas (AD-MBA), which will serve as a central, unified research resource for multi-omic and connectomic mouse brain datasets emerging from the NIA AD Multimodal Atlas Projects (AD-MAPs). The Data Coordinating Center will (1) leverage the NIA-supported AD Knowledge Portal data infrastructure to facilitate hosting, deposition, and dissemination of multimodal datasets generated by the AD-MAPs program, (2) facilitate collaborative analyses among the data-contributing teams, (3) develop/optimize and incorporate tools for multiscale integration of multi-omics and connectomics datasets, and (4) create a broadly accessible web-based interface for the visualization and dissemination of integrated multiscale data.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["omics and genetics"], "matches": ["multi-omics"], "excluded": []}, {"id": "grant:360544", "kind": "Funding opportunity", "number": "RFA-DK-27-120", "title": "Nutrition Obesity Research Centers (NORCs) (P30 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-20", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360544", "description": "This Notice of Funding Opportunity (NOFO) invites applications from institutions/organizations that propose to establish core centers that are part of an integrated and existing program of nutrition and/or obesity research. The Nutrition Obesity Research Centers (NORC) program is designed to support and enhance the national research effort in nutrition and obesity. NORCs support three primary research-related activities: Research Core services, a Pilot and Feasibility (P and F) program, and a Scientific Catalyst program. All activities pursued by Nutrition Obesity Research Centers are designed to enhance the efficiency, productivity, effectiveness, and multidisciplinary nature of research in nutrition and obesity.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["microbiome and nutrition"], "matches": ["nutrition"], "excluded": []}, {"id": "grant:359280", "kind": "Funding opportunity", "number": "RFA-HG-27-012", "title": "GREGoRi Technology Integration Center (U01, Clinical Trials Optional)", "agency": "National Institutes of Health", "posted": "2026-06-18", "deadline": "2026-10-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359280", "description": "The Genomics Research to Elucidate the Genetics of Rare Diseases:innovation (GREGoRi) initiative seeks to accelerate a paradigm shift in rare disease diagnosis by reimagining the tools, molecular technologies and analytical approaches used to identify the causal gene(s) and/or variant(s) underlying rare genetic disorders. The purpose of this Notice of Funding Opportunity is to establish the GREGoRi Technology Integration Center, which will enable the development of standards and best practices for applying new and emerging molecular methods in rare disease diagnosis. A major deliverable of the Center will be a multidimensional dataset that can be used for the development and benchmarking of novel tools and strategies that facilitate rare disease diagnosis.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 6, "topics": ["omics and genetics"], "matches": ["genomics"], "excluded": []}, {"id": "grant:360554", "kind": "Funding opportunity", "number": "PAR-27-051", "title": "NIH Brain Development Cohorts (NBDC) and Population Assessment of Tobacco and Health (PATH) Study Biospecimen Access (X01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-01", "deadline": "2029-04-17", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360554", "description": "The National Institutes of Health seek to advance their mission by providing the scientific community with the opportunity to request access to biospecimens from the Adolescent Brain Cognitive DevelopmentSM (ABCD) Study, the HEALthy Brain and Child Development (HBCD) Study, and the Population Assessment of Tobacco and Health (PATH) Study to conduct research consistent with the respective study objectives that will maximize the scientific utility of these limited samples. Applications should expand the knowledge gained from these studies and advance our understanding of the multiple genetic and environmental factors, such as exposure to substances, that affect health and disease over the course of a lifetime.", "source": "Grants.gov", "first_seen": "2026-09-02", "is_new": false, "score": 4, "topics": ["development and disparities"], "matches": ["child development"], "excluded": []}, {"id": "grant:360404", "kind": "Funding opportunity", "number": "PAR-27-065", "title": "NINDS Efficacy and Exploratory Clinical Trials (UG3/UH3 - Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2029-03-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360404", "description": "This Notice of Funding Opportunity (NOFO) encourages applications for investigator-initiated clinical trials to the National Institute of Neurological Disorders and Stroke (NINDS). These trials must address questions within the mission and research interests of the NINDS and may include studies of small molecules, biologics, devices as well as surgical, behavioral, diet-based, or rehabilitation therapies. Studies addressing neurological diseases and care across the lifespan are highly encouraged. This notice invites both early- and middle-phase exploratory clinical trials as well as later phase confirmatory Phase 3 or comparative effectiveness clinical trials.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["microbiome and nutrition"], "matches": ["diet"], "excluded": []}, {"id": "grant:363679", "kind": "Funding opportunity", "number": "PAR-28-059", "title": "Translational Research in Maternal and Pediatric Pharmacology and Therapeutics", "agency": "HHS-NIH11", "posted": "2026-08-20", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363679", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["maternal and infant health"], "matches": ["maternal"], "excluded": []}, {"id": "grant:359644", "kind": "Funding opportunity", "number": "RFA-HG-27-013", "title": "GREGoRi Innovation Projects (U01 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-18", "deadline": "2026-10-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359644", "description": "The Genomics Research to Elucidate the Genetics of Rare Diseases:innovation (GREGoRi) initiative seeks to accelerate a paradigm shift in rare disease diagnosis by reimagining the tools, molecular technologies and analytical approaches used to identify the causal gene(s) and/or variant(s) underlying rare genetic disorders. This Notice of Funding Opportunity is intended to stimulate the development and testing of highly innovative experimental or computational approaches for rare disease diagnosis, that have the potential to make transformative improvements to the current state of the art.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["omics and genetics"], "matches": ["genomics"], "excluded": []}, {"id": "grant:359279", "kind": "Funding opportunity", "number": "RFA-HG-27-011", "title": "GREGoRi Data Coordination and Outreach Center (U01, Clinical Trials Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-18", "deadline": "2026-10-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359279", "description": "The Genomics Research to Elucidate the Genetics of Rare Diseases:innovation (GREGoRi) initiative seeks to accelerate a paradigm shift in rare disease diagnosis by reimagining the tools, molecular technologies and analytical approaches used to identify the causal gene(s) and/or variant(s) underlying rare genetic disorders. The purpose of this Notice of Funding Opportunity is to establish the GREGoRi Data Coordination and Outreach Center. The Data Coordination and Outreach Center will act as the central point of coordination for the GREGoRi Research Program, and will be responsible for ensuring that the protocols, data, metadata, computational tools and other resources developed as part of GREGoRi are made available to the broader research community.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 4, "topics": ["omics and genetics"], "matches": ["genomics"], "excluded": []}, {"id": "grant:361431", "kind": "Funding opportunity", "number": "RFA-RM-27-024", "title": "Pilot Projects to Enhance the Human Virome Program (R03 Clinical Trials Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-10-08", "deadline": "2026-11-10", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361431", "description": "The Common Fund Human Virome Program (HVP) aims to extensively and comprehensively characterize the \"healthy\" human virome (the collection of viruses that normally reside inside the human body without evidence of disease) and create tools, models, and methods that will enable an in-depth study of its variation and composition in relation to host factors and its influence on health and disease. The purpose of this NOFO is to support small pilot projects that extend the goals of the HVP, including further validating, improving, and complementing existing and newly developed tools from the HVP program by leveraging human specimens collected from the cohorts under the program; samples from animals to promote the refinement, utilization, and translation of these tools to better serve the goals of the HVP program; expanding existing cohorts and/or biospecimen sampling sites for virome characterization; developing tools, assays, and methods to study the human virome; and defining functional interactions between the human virome and host. These pilot projects will expand the HVP consortium, and collaboration across the HVP is expected. Applicants outside the current HVP are encouraged to apply and pilot projects should not overlap with existing HVP efforts (visit the Common Fund website for a list of funded research).", "source": "Grants.gov", "first_seen": "2026-10-08", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360366", "kind": "Funding opportunity", "number": "RFA-DA-28-012", "title": "HEAL Initiative: Integrative Management of chronic Pain and OUD for Whole Recovery (IMPOWR) - Building Engagement, Assistance, Capacity, Outreach, and Networks (BEACON) Center (U2C Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-10-06", "deadline": "2027-01-26", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360366", "description": "The National Institutes of Health (NIH) intends to renew the Integrative Management of chronic Pain and OUD for Whole Recovery (IMPOWR) research network. This renewal consists of individual research projects, which will be supported by a single Coordination Center. This network is intended to test new innovations that integrate evidence based treatments for chronic pain (CP) and opioid use disorder (OUD). This research will characterize or modify factors that impact wide-scale adoption and sustained use of effective treatments at this intersection. The network will be part of the NIH’s Helping to End Addiction Long-term (HEAL®) Initiative to speed the development and implementation of scientific solutions to the national opioid public health crisis. The NIH HEAL Initiative will bolster research across NIH to (1) improve treatment and prevention of opioid misuse and OUD and (2) enhance pain management. This notice of funding opportunity (NOFO) seeks applications for a single Building Engagement, Assistance, Capacity, Outreach, and Networks (BEACON) Center. The BEACON Center will provide overall network coordination support; research education activities to build capacity at the intersection of CP, OUD, and implementation science; annual survey/qualitative activities to understand different barriers and attitudes impacting access and sustained use of integrated CP and OUD service delivery; and develop key resources for stakeholders that can inform/improve sustainability and scalability of evidence-based practices, including findings and resources from IMPOWR Phase I.", "source": "Grants.gov", "first_seen": "2026-10-07", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360402", "kind": "Funding opportunity", "number": "RFA-NS-28-010", "title": "BRAIN Initiative: Research Opportunities Using Invasive Neural Recording and Stimulating Technologies in the Human Brain (R01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-30", "deadline": "2029-02-08", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360402", "description": "This funding opportunity supports transformative, mechanistic research aimed at understanding how the human brain functions. Applications should seek to reveal how the dynamic activity of individual neurons and ensembles of neurons within spatially organized brain networks gives rise to internal experiences, such as sensations, perceptions, emotions, thoughts, and memories, as well as to observable motor and social behaviors. To achieve fundamental mechanistic insights into human brain function, proposed studies are expected to leverage opportunities made possible by invasive surgical procedures in humans, such as intracranial recording or stimulation. These investigations may be enhanced by incorporating complementary experimental models or systems that provide access to knowledge, techniques, or resources not otherwise available in human neuroscience research. Such integration is encouraged to strengthen the mechanistic understanding of human brain function and to connect discoveries across species and biological scales. This program builds on cutting-edge advances enabled by the BRAIN Initiative and the broader neuroscience community. Projects supported through this opportunity are expected to produce transformative outcomes by the end of the funding period. Approaches should be rigorous, mechanistic, and innovative by (1) maximizing opportunities to conduct innovative in vivo human neuroscience research made available by direct access to the human brain from invasive surgical procedures, (2) employing approaches guided by specified theoretical constructs and/or quantitative, mechanistic models. Funded investigators will join a consortium working group, coordinated by the NIH, to identify consensus standards of practice, including neuroethical considerations, to collect and provide data for ancillary studies, and to aggregate and standardize data for dissemination among the wider scientific community.", "source": "Grants.gov", "first_seen": "2026-09-30", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359657", "kind": "Funding opportunity", "number": "RFA-MH-27-125", "title": "Mechanistic Evaluation of Therapeutic Targets derived from Treatable Traits to Improve CNS Outcomes in People with HIV (R21/R33 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-30", "deadline": "2027-10-28", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359657", "description": "The purpose of this notice of funding opportunity (NOFO) is to identify modifiable mechanisms and therapeutic targets to address central nervous system (CNS) complications associated with human immunodeficiency virus (HIV). The initiative supports a phased research approach beginning with the identification of patient phenotypes characterized by convergent pathophysiological features, followed by the discovery and experimental validation of molecular mechanisms using innovative in-vitro and in-vivo models. The goal of this NOFO is to advance therapeutic target, and intervention discovery to address the multifactorial and heterogeneous nature of HIV-associated CNS dysfunction.", "source": "Grants.gov", "first_seen": "2026-10-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:361304", "kind": "Funding opportunity", "number": "PAR-27-045", "title": "HEAL Initiative: Whole Joint Health Program (R61/R33 Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-09-28", "deadline": "2026-10-30", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361304", "description": "The NIH Helping to End Addiction Long-term ® (HEAL) Initiative is releasing this Notice of Funding Opportunity (NOFO) to support a phased mechanistic clinical research program focusing on understudied biological mechanisms that drive joint pain. The phased projects supported by this program (of up to five years total in duration) will first identify and validate multi-tissue mechanisms underlying joint pain, then test non-pharmacologic or multimodal interventions that directly target these mechanisms. The initiative responds to priorities identified in the 2023 HEAL Whole Joint Pain Workshop and supports the broader goals of the NIH HEAL Initiative and the Make America Healthy Again vision by advancing safe, non-addictive, and prevention-oriented approaches to chronic pain.", "source": "Grants.gov", "first_seen": "2026-09-28", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360545", "kind": "Funding opportunity", "number": "PAR-28-072", "title": "NEI Translational Research Program for Therapeutics (R61/R33 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-25", "deadline": "2029-11-16", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360545", "description": "The purpose of NEI's Translational Research program (TRP) is the rapid and efficient translation of innovative laboratory research findings into therapeutics for use by clinicians to treat visual system diseases or disorders. The TRP will support the product development of biological, pharmaceutical, medical device, and/or combination therapies for any disease or disorder of the visual system.The TRP will utilize a bi-phasic, milestone-driven mechanism of award. The R61 phase can be up to two years and will support research that has demonstrated significant preliminary data but has not advanced to the level of clinical translation. The R33 phase can be up to four years and will support research that is in the final states of preclinical development with potential for near-term clinical development. The total duration of both R61 and R33 cannot exceed five years. The R33 is to focus on advancing a single therapeutic candidate through Investigational New Drug or Investigational Device Exemption (IND/IDE) enabling studies, filing an IND/IDE package with the FDA, and designing future clinical trials. R33 recipients must submit or obtain an IND/IDE application to FDA, or must transition the product to clinical practice, within the period of performance. The specific activities appropriate for the R33 phase will depend on the product under study and available preliminary data on the product. Delineation of milestones by the applicant for the R61 and R33 phases is a key characteristic of this program. A milestone is defined as a scheduled event in the project timeline that signifies the completion of a major project stage or activity. This program will support applications that propose a series of milestones including manufacturing and product development goals. Applications that address contingency plans to proactively confront potential delays in meeting the milestones are strongly encouraged. Milestones are required for both phases. Milestones must be specific, measurable, achievable, relevant, and time-bound (SMART). All projects will begin with a R61 phase regardless of therapeutic starting point.", "source": "Grants.gov", "first_seen": "2026-09-25", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:361275", "kind": "Funding opportunity", "number": "PAR-28-056", "title": "Pancreatic Cancer Detection Consortium: Research Units (U01 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-09-25", "deadline": "2029-11-05", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361275", "description": "Through this Notice of Funding Opportunity (NOFO), NCI solicits applications for the Research Units (RUs), one of the two scientific components of the Pancreatic Cancer Detection Consortium (PCDC), to conduct research on early detection of pancreatic ductal adenocarcinoma (PDAC) and characterization of its precursor lesions to identify patients who are at high risk of progression to cancer. The PCDC will continue to address one of the four research priorities identified in the NCI's 2014 Scientific Framework for Pancreatic Ductal Adenocarcinoma (PDAC). The PCDC will support research for the development and testing of new molecular and imaging biomarkers for detecting PDAC early and for identifying patients at high risk of PDAC (because of genetic factors, family history and/or the presence of precursor lesions) who could be candidates for early intervention. The PCDC-RUs will consist of multi-disciplinary teams and will undertake studies to: identify and test biomarkers measurable in bodily fluids for early detection of PDAC and/or its precursor lesions; develop molecular- and/or imaging-based markers of pancreatic cysts and determine which lesions are likely to progress to cancer; develop molecular- and/or imaging-based approaches for screening populations at high risk of PDAC; use machine learning and computational approaches towards biomarker discovery and/or validation; and conduct biomarker validation studies. The PCDC-RUs will also collect longitudinal biospecimens for building a biorepository. Each PCDC-RU is expected to participate in collaborative activities with other PCDC-RUs and share ideas, biospecimens, and data within the Consortium.", "source": "Grants.gov", "first_seen": "2026-09-26", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:362965", "kind": "Funding opportunity", "number": "RFA-OD-27-009", "title": "Limited Competition: NIH Research Evaluation and Commercialization Hubs (REACH) (SB0 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-09-24", "deadline": "2026-11-10", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/362965", "description": "This Notice of Funding Opportunity (NOFO) announces the renewal of the NIH Research Evaluation and Commercialization Hub (REACH) program, established to facilitate and accelerate the translation of academic biomedical discoveries into products that improve patient care and public health. Through this program, NIH will provide the qualifying institutions with the funds to seed the creation of academic entrepreneurship Hubs. Hubs will be responsible for providing innovators with both the initial investment and resources to support the proof-of-concept work and the mentorship in product development and commercialization needed to develop high priority technologies within the NIH's mission. Funded Hubs are intended to work as a consortium to enable: (1) the infrastructure for identifying the most promising technologies, (2) funding for product definition studies (e.g. feasibility studies, prototype development, proof-of-concept studies) provided to individual researchers, (3) access to resources and expertise in areas required for early stage technology development (including scientific, regulatory, reimbursement, business, legal, and project management), and (4) skills development and hands-on experience in entrepreneurship. Establishing public-private partnerships and providing additional non-federal funds will be critical for success. This is a Notice of Funding Opportunity (NOFO) for a Limited Competition that will invite applications from eligible organizations to apply. Please see Section III. Eligibility for additional information. In accordance with NIH standard peer-review processes, the application(s) will be peer-reviewed, and only meritorious application(s) will be considered for funding.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363915", "kind": "Funding opportunity", "number": "PAR-28-061", "title": "Research to Improve Rigor, Replicability, and Reproducibility in Biomedical and Behavioral Sciences", "agency": "HHS-NIH11", "posted": "2026-09-22", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363915", "description": "", "source": "Grants.gov", "first_seen": "2026-09-22", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363877", "kind": "Funding opportunity", "number": "PAR-29-002", "title": "Development of Models, New Approach Methodologies, and Biological Materials for Studying Human Health and Diseases (R21 Clinical Trial Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-09-16", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363877", "description": "", "source": "Grants.gov", "first_seen": "2026-09-17", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363874", "kind": "Funding opportunity", "number": "RFA-MH-28-115", "title": "Single Source: Scalable and Systematic Neurobiology of Psychiatric and Neurodevelopmental Disorder Risk Genes: Data Resource and Administrative Coordination Center (U24 Clinical Trial Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-09-16", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363874", "description": "", "source": "Grants.gov", "first_seen": "2026-09-17", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363850", "kind": "Funding opportunity", "number": "RFA-RM-28-012", "title": "R3PEATS Multi-Team Triangulation: Collaborative Cross-Method Approaches to Scientific Discovery (RM1)", "agency": "HHS-NIH11", "posted": "2026-09-11", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363850", "description": "", "source": "Grants.gov", "first_seen": "2026-09-11", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363840", "kind": "Funding opportunity", "number": "RFA-NS-28-006", "title": "BRAIN Initiative: Clinical Studies to Advance Next-Generation Devices for Recording and Modulation in the Human Central Nervous System", "agency": "HHS-NIH11", "posted": "2026-09-10", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363840", "description": "", "source": "Grants.gov", "first_seen": "2026-09-10", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:361833", "kind": "Funding opportunity", "number": "RFA-AI-27-014", "title": "Development of Candidate Medical Countermeasures (MCMs) and Technologies Against Radiological/Nuclear or Chemical Threats (U01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-09-01", "deadline": "2028-10-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361833", "description": "The purpose of this notice of funding opportunity (NOFO) is to support research that advances understanding of the natural history of radiation or chemical exposures; develops relevant injury models; identifies and validates diagnostic tools, biomarkers, or triage technologies; and supports the development of effective medical countermeasures (MCMs) to mitigate or treat acute and/or delayed injuries resulting from radiological/nuclear or chemical public health emergencies.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:361213", "kind": "Funding opportunity", "number": "RFA-DK-27-112", "title": "Single Source for the Continuation of the Epidemiology of Diabetes Interventions and Complications (EDIC) Study Research Center (Collaborative U01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2026-11-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361213", "description": "This is a Notice of Funding Opportunity (NOFO) for a Single Source that will invite an application from the eligible organization to apply. Please see Section III. Eligibility for additional information. In accordance with NIH standard peer-review processes, applications will be peer-reviewed, and only meritorious applications will be considered for funding. Through this NOFO, the National institute of Diabetes and Digestive and Kidney Diseases (NIDDK) invites an application to continue to follow the Epidemiology of Diabetes Interventions and Complications (EDIC) cohort through a collaborative cooperative agreement that addresses specific knowledge gaps in the development and progression of type 1 diabetes complications. Applications should include hypothesis-based research, support for cohort infrastructure and/or maintenance, continued follow-up, and supporting collaborative research to utilize the EDIC cohort as well as its data set and biologic/genetic samples.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360398", "kind": "Funding opportunity", "number": "RFA-NS-27-002", "title": "BRAIN Initiative: Integrative Team-Research BRAIN Circuits Program - iBCP (RM1 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2028-06-23", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360398", "description": "This Notice of Funding Opportunity (NOFO) supports transdisciplinary research teams seeking to develop mechanistic, biologically grounded explanations of how neural circuits and their cellular building blocks give rise to central nervous system (CNS) function. Teams must integrate expertise spanning molecular and cellular through systems neuroscience, with strong collaboration between experimental and computational investigators, to bridge cells, circuits, and behavior in a unified framework that yields mechanistic insight.Applications must explicitly connect three core elements: (1) characterization of circuit components (e.g., cell types and/or connectivity); (2) measurement of dynamic circuit activity, incorporating in vivo CNS recordings at cellular and sub-second temporal resolution; and (3) analyses of a tractable behavior or functional output.To address this significant challenge in neuroscience, proposed studies are expected to leverage innovative conceptual or theoretical frameworks, predictive models, and/or cutting-edge approaches that unify these three levels of analysis and bridge experimental and computational components.Recipients are expected to participate in BRAIN consortia activities to identify standards of practice towards multi-level integration.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360947", "kind": "Funding opportunity", "number": "PAR-27-068", "title": "Limited Competition: NIGMS Mature Synchrotron Resources (MSR) for Structural Biology (P30 - Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2028-10-02", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360947", "description": "This Notice of Funding Opportunity (NOFO) supports \"mature\" resources at synchrotron facilities that provide user access to X-ray beamlines for static and dynamic imaging of biological systems ranging from molecules to organs. \"Mature\" refers to the techniques made available at the resource beamlines, which must be well established and provide utility to the communities they serve without requiring significant novel technology development. Applications may only request support for existing synchrotron resources that are currently supported by NIGMS funding. The facility is expected to be maintained or upgraded to current best practices, make its capabilities and availability known to the biomedical research community through outreach activities, and provide user training and support.This is a Notice of Funding Opportunity (NOFO) for a Limited Competition that will invite application(s) from eligible organization(s) to apply. Please see Section III. Eligibility for additional information. In accordance with NIH standard peer-review processes, the application(s) will be peer-reviewed, and only meritorious application(s) will be considered for funding.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:361518", "kind": "Funding opportunity", "number": "PAR-27-053", "title": "Exploratory Clinical Neuroscience Research on Substance Use Disorders (R61/R33 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2028-06-16", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/361518", "description": "This notice of funding opportunity (NOFO) uses a R61/R33 Phased Innovation Award activity code to support clinical research applications that are exploratory and developmental in nature and focus on understanding the neurobiological mechanisms underlying substance use disorders (SUD), including fundamental circuitry and behavior relevant to substance use. For projects not requiring a phased research approach, applicants are encouraged to apply under a different funding activity code (e.g., PA-25-305 \"Research Project Grant (Parent R01 Clinical Trial Required)\" or its subsequent reissue).", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360606", "kind": "Funding opportunity", "number": "RFA-CA-27-005", "title": "Glioblastoma Therapeutics Network (GTN) (U19 Clinical Trial Required)", "agency": "National Institutes of Health", "posted": "2026-08-31", "deadline": "2027-01-11", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360606", "description": "Through this Notice of Funding Opportunity (NOFO), the National Cancer Institute (NCI) solicits applications for research on novel therapies for adult glioblastoma (GBM). The goal is to improve the treatment of adult GBM by developing novel effective agents that can cross the blood brain barrier (BBB) and testing them clinically. Successful early-stage trials of new drugs from this NOFO would transition seamlessly to later stage trials using well-established NCI clinical trial mechanisms. To implement this concept, a highly collaborative GBM Therapeutics Network (GTN) of cross-cutting teams will be established, each team capable of driving therapeutic agent(s) from pre-clinical development, through investigational new drugs (IND) studies, into pilot clinical studies in humans. Appropriate therapeutic agents include: (1) novel agents or (2) agents or combinations approved for other indications and repurposed for treatment of GBM following appropriate preclinical studies. The scope of the NOFO, from late pre-clinical through early (Phase 0/1) clinical studies, uniquely spans a gap in the GBM drug development process.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363695", "kind": "Funding opportunity", "number": "PAR-28-060", "title": "Small Instruments and Modern Equipment for Shared-use Biomedical Research Facilities and Resources (S15 Clinical Trial Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-08-24", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363695", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363678", "kind": "Funding opportunity", "number": "RFA-DK-28-116", "title": "Multimodal AI to Accelerate Precision Medicine for Type 1 Diabetes (U01- Clinical Trials Not Allowed)", "agency": "HHS-NIH11", "posted": "2026-08-20", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363678", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363126", "kind": "Funding opportunity", "number": "RFA-OD-28-001", "title": "Tobacco Centers of Regulatory Science (TCORS) (Clinical Trial Optional)", "agency": "HHS-NIH11", "posted": "2026-07-09", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363126", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363052", "kind": "Funding opportunity", "number": "RFA-DK-28-112", "title": "NIDDK Disease Research and Translational Core Centers (P30 Clinical Trial Optional)", "agency": "HHS-NIH11", "posted": "2026-07-02", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363052", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:363037", "kind": "Funding opportunity", "number": "RFA-DK-28-114", "title": "NIDDK Multi-Purpose Resource-Related, Multi-Component Research Services Centers Cooperative Agreement (U2C - Clinical Trial Optional)", "agency": "HHS-NIH11", "posted": "2026-07-01", "deadline": "", "status": "Forecasted", "url": "https://www.grants.gov/search-results-detail/363037", "description": "", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359270", "kind": "Funding opportunity", "number": "RFA-RM-27-012", "title": "PRIMED-AI: Data-to-Model Academic-Industrial Partnerships (D2M-AIP) for Precision Medicine with AI: Integrating Imaging with Multimodal Data (UG3/UH3 Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-19", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359270", "description": "The overarching goal of this notice of funding opportunity (NOFO) and its companion opportunities is to establish the Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) Program to support development of innovative, reliable, cost-effective, and sustainable multimodal AI-based clinical decision support (CDS) tools. PRIMED-AI CDS tools are based on the integration of clinical imaging with other types of multimodal health data to enhance care for patients with a wide range of health conditions. The PRIMED-AI Program seeks to catalyze the adoption of AI-based CDS tools into clinical workflows to enable novel personalized medicine strategies that address significant health challenges. The purpose of this Notice of Funding Opportunity (NOFO) is to catalyze the development and testing of Artificial Intelligence (AI)-enabled, image-centered, multimodal Clinical Decision Support (CDS) tools, developed in pursuance as Software as a Medical Device (SaMD). These projects are expected to have high potential for demonstrable, positive impact on patient outcomes and/or healthcare processes.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359666", "kind": "Funding opportunity", "number": "RFA-RM-27-013", "title": "Model-to-Clinic (M2C) for Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) (UG3/UH3, Clinical Trial Optional)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-19", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359666", "description": "The overarching goal of this notice of funding opportunity (NOFO) and its companion opportunities is to establish the Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) Program to support development of innovative, reliable, cost-effective, and sustainable multimodal AI-based clinical decision support (CDS) tools. PRIMED-AI CDS tools are based on the integration of clinical imaging with other types of multimodal health data to enhance care for patients with a wide range of health conditions. The PRIMED-AI Program seeks to catalyze the adoption of AI-based CDS tools into clinical workflows to enable novel personalized medicine strategies that address significant health challenges.The purpose of this NOFO is to catalyze the translation of Artificial Intelligence (AI)-enabled, image-centered, multimodal CDS tools, developed as Software as a Medical Device, from training and testing of prototypes towards clinical applications that address unmet health challenges in precision medicine. These projects are expected to have high potential for demonstrable, positive impact on patient outcomes and/or healthcare processes.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:359271", "kind": "Funding opportunity", "number": "RFA-RM-27-011", "title": "Development and Testing of a Multi-use Frameworks Playbook for Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) (U01 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-30", "deadline": "2026-10-09", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/359271", "description": "The overarching goal of this notice of funding opportunity (NOFO) and its companion opportunities is to establish the Precision Medicine with AI: Integrating Imaging with Multimodal Data (PRIMED-AI) Program to support development of innovative, reliable, cost-effective, and sustainable multimodal AI-based clinical decision support (CDS) tools. PRIMED-AI CDS tools are based on the integration of clinical imaging with other types of multimodal health data to enhance care for patients with a wide range of health conditions. The PRIMED-AI Program seeks to catalyze the adoption of AI-based CDS tools into clinical workflows to enable novel personalized medicine strategies that address significant health challenges. The purpose of this NOFO is to solicit applications for the design, development, and preliminary validation of robust frameworks for the application of multimodal-artificial intelligence (AI) models for clinical use. Frameworks developed through these awards would populate a \"playbook\", defined as a collection of actionable guidelines, standardized protocols, and/or standard operating procedures (SOPs) for reliable and effective development and deployment of multimodal AI tools. It is expected that the frameworks delineated in this playbook will directly address PRIMED-AI objectives and needs, while also remaining flexible enough to enable sufficient extensibility and interoperability for use across a broad spectrum of multimodal biomedical AI applications, both internal and external to the PRIMED-AI Program.", "source": "Grants.gov", "first_seen": "2026-09-01", "is_new": false, "score": 3, "topics": [], "matches": [], "excluded": []}, {"id": "grant:360882", "kind": "Funding opportunity", "number": "PAR-27-021", "title": "Seed Instrumentation Support (SIS) Program (S10 Clinical Trial Not Allowed)", "agency": "National Institutes of Health", "posted": "2026-06-25", "deadline": "2028-07-01", "status": "Posted", "url": "https://www.grants.gov/search-results-detail/360882", "description": "This Notice of Funding Opportunity (NOFO) aims to build new research capacity and develop a sustainable research program by supporting the purchase of a single commercially available biomedical research instrument currently unavailable in the institution. Instruments funded through this program must be shared among the users to create new research opportunities, enable reproducible data generation, encourage collaborative re
